name: Health office workspace
on:
  pull_request:
    paths:
      - 'example/src/office/**'
      - 'example/src/components/LazyOfficeWorkspace.svelte'
      - 'example/src/App.svelte'
      - 'packages/ui/src/components/Sidebar.svelte'
      - 'packages/ui/src/components/Breadcrumbs.svelte'
      - 'packages/ui/src/components/Toast.svelte'
      - 'e2e/health-office*.spec.ts'
      - 'playwright.office.config.ts'
      - '.github/workflows/health-office.yml'
permissions:
  contents: read
concurrency:
  group: health-office-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  health-office:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint changed workspace
        run: bunx eslint example/src/App.svelte example/src/office example/src/components/LazyOfficeWorkspace.svelte packages/ui/src/components/Sidebar.svelte packages/ui/src/components/Breadcrumbs.svelte packages/ui/src/components/Toast.svelte e2e/health-office*.spec.ts playwright.office.config.ts --max-warnings 0
      - name: Domain state tests
        run: bun test example/src/office/domain.test.ts example/src/office/zh-CN.test.ts
      - name: Build workspace dependencies
        run: bun run build:packages
      - name: Type check example and business tests
        run: cd example && bun run check
      - name: Build production example
        run: cd example && bun run build
      - name: Diff whitespace check
        run: git diff --check HEAD^ HEAD
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser workflows and real screenshot evidence
        run: bunx playwright test --config playwright.office.config.ts --fail-on-flaky-tests
      - name: Archive exact reviewed source and patch
        run: |
          mkdir -p health-office-delivery
          git rev-parse HEAD > health-office-delivery/tested-commit.txt
          git diff --binary HEAD^ HEAD > health-office-delivery/changes.patch
          git archive --format=tar HEAD example/src/App.svelte example/src/office example/src/components/LazyOfficeWorkspace.svelte packages/ui/src/components/Sidebar.svelte packages/ui/src/components/Breadcrumbs.svelte packages/ui/src/components/Toast.svelte docs/product/health-office .agents/skills/health-office-product e2e/health-office.spec.ts e2e/health-office-chinese.spec.ts playwright.office.config.ts .github/workflows/health-office.yml | gzip > health-office-delivery/source.tar.gz
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: health-office-browser-evidence
          path: |
            test-results/**/screenshots/*.png
            test-results/**/error-context.md
            playwright-report/
            health-office-delivery/
          if-no-files-found: warn
