name: Content recipe checks
on:
  push:
    branches: [main]
    paths: ['packages/ui/**', 'packages/core/**', 'scripts/**', 'bun.lock', '.github/workflows/content-recipe-checks.yml']
  pull_request:
    branches: [main]
    paths: ['packages/ui/**', 'packages/core/**', 'scripts/**', 'bun.lock', '.github/workflows/content-recipe-checks.yml']
permissions:
  contents: read
concurrency:
  group: content-recipes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch immutable comparison sources
        run: git fetch --quiet --no-tags --depth=1 origin ee01ea0b52285bd3129447cd0b2ddb0c114f45ce
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Frozen installation
        env:
          HUSKY: '0'
        run: |
          set -euo pipefail
          mkdir -p test-results/content-recipes/logs
          bun install --frozen-lockfile > test-results/content-recipes/logs/install.log 2>&1 || { tail -100 test-results/content-recipes/logs/install.log; exit 1; }
          git diff --exit-code -- bun.lock
      - name: Build the candidate workspace
        run: |
          set -euo pipefail
          bun run build:packages > test-results/content-recipes/logs/build.log 2>&1 || { tail -100 test-results/content-recipes/logs/build.log; exit 1; }
      - name: Existing CSS and new content contracts
        id: contracts
        continue-on-error: true
        run: |
          set -euo pipefail
          bun run --cwd packages/ui test:css > test-results/content-recipes/logs/existing-css.log 2>&1 || { tail -100 test-results/content-recipes/logs/existing-css.log; exit 1; }
          node --test packages/ui/scripts/tailwind-recipes.test.mjs packages/ui/scripts/content-trend-parity.test.mjs > test-results/content-recipes/logs/content-css.log 2>&1 || { tail -200 test-results/content-recipes/logs/content-css.log; exit 1; }
          tail -12 test-results/content-recipes/logs/content-css.log
      - name: Strict UI types
        id: types
        continue-on-error: true
        run: |
          set -euo pipefail
          node node_modules/svelte-check/bin/svelte-check --tsconfig packages/ui/tsconfig.json > test-results/content-recipes/logs/types.log 2>&1 || { tail -300 test-results/content-recipes/logs/types.log; exit 1; }
          tail -8 test-results/content-recipes/logs/types.log
      - name: Repository lint
        id: lint
        continue-on-error: true
        run: |
          set -euo pipefail
          bun run lint > test-results/content-recipes/logs/lint.log 2>&1 || { tail -100 test-results/content-recipes/logs/lint.log; exit 1; }
      - name: Install actual Chromium
        run: bunx playwright install --with-deps chromium
      - name: Production Svelte browser comparison
        id: browser
        continue-on-error: true
        run: |
          set -euo pipefail
          node packages/ui/scripts/verify-content-recipes.mjs > test-results/content-recipes/logs/browser.log 2>&1 || { tail -100 test-results/content-recipes/logs/browser.log; exit 1; }
          tail -8 test-results/content-recipes/logs/browser.log
      - name: Whitespace and exact source provenance
        if: always()
        run: |
          set -euo pipefail
          mkdir -p test-results/content-recipes
          git diff --check ee01ea0b52285bd3129447cd0b2ddb0c114f45ce HEAD
          git diff --stat ee01ea0b52285bd3129447cd0b2ddb0c114f45ce HEAD > test-results/content-recipes/diff-stat.txt
          git rev-parse HEAD HEAD^{tree} > test-results/content-recipes/revision.txt
          git diff --binary ee01ea0b52285bd3129447cd0b2ddb0c114f45ce HEAD > test-results/content-recipes/change.patch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: content-recipe-evidence-${{ github.sha }}
          path: test-results/content-recipes/
          if-no-files-found: error
          retention-days: 14
      - name: Require every attempted check to succeed
        if: always()
        env:
          CONTRACTS: ${{ steps.contracts.outcome }}
          TYPES: ${{ steps.types.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          set -euo pipefail
          test "$CONTRACTS" = success
          test "$TYPES" = success
          test "$LINT" = success
          test "$BROWSER" = success
