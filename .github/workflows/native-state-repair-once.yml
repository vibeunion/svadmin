name: Native dynamic-state migration verification
on:
  push:
    branches: [feat/ui-panda-complete-20260919]
    paths: ['.github/workflows/native-state-repair-once.yml']
permissions:
  contents: read
jobs:
  states:
    if: github.repository == 'vibeunion/svadmin' && github.ref == 'refs/heads/feat/ui-panda-complete-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Migrate reviewed class directives and layout declarations
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const hashes = {
            'packages/ui/src/components/LoginPage.svelte': '2a79440eb469bca6a608378cb97ebf39856ad844',
            'packages/ui/src/components/StepsForm.svelte': '8c7b8c7ddaa7f14d5a72bc4034848dc623d31a92',
            'packages/ui/src/components/Sidebar.svelte': '29e6fd7a9162a6c8a859bae02ff82f0ef38c7ee4',
            'packages/ui/src/components/DevTools.svelte': '24ae07ac73b50bdb0d4dbf6183f2970bedb5f3b0',
            'packages/ui/src/components/Layout.svelte': '3a5eb6b80d9f295578250473777d81ad877051ca',
            'packages/ui/src/components.css': 'bb19a2ac9c20f8c32a103467014f3925dab72792',
            'packages/ui/src/app.css': 'cb9e8c42fcdedb2fd62c74890adbddd50610179c',
            'example/vite.config.ts': 'f30fbafdf701b9ab96e0feaa5c56cc81bd45a1b4',
            'scripts/check-example-bundle.ts': '640640795daa6675b7b7ada5dc70f8f7c78b57c9',
          };
          for (const [path, hash] of Object.entries(hashes)) assert.equal(execFileSync('git', ['hash-object', path], { encoding: 'utf8' }).trim(), hash, `Re-review concurrent edits in ${path}`);
          const replace = (path, before, after, count = 1) => {
            const source = readFileSync(path, 'utf8');
            assert.equal(source.split(before).length - 1, count, `${path}: reviewed edit count changed`);
            writeFileSync(path, source.replaceAll(before, after));
          };
          const classes = JSON.parse(readFileSync('packages/ui/scripts/utility-class-map.json', 'utf8'));
          const nativeStates = { 'w-[252px]': 'svadmin-sidebar--expanded', 'w-[70px]': 'svadmin-sidebar--collapsed', 'w-auto': 'svadmin-devtools--collapsed-width', 'min-w-[200px]': 'svadmin-devtools--collapsed-min-width' };
          for (const name of ['LoginPage', 'StepsForm', 'Sidebar', 'DevTools']) {
            const path = `packages/ui/src/components/${name}.svelte`;
            const source = readFileSync(path, 'utf8');
            const directives = [...source.matchAll(/class:([^=\s>]+)=/g)].map(match => match[1]);
            for (const value of new Set(directives)) {
              const replacement = nativeStates[value] ?? classes[value];
              assert.ok(replacement, `Unreviewed state ${name}: ${value}`);
              replace(path, `class:${value}=`, `class:${replacement}=`, directives.filter(item => item === value).length);
            }
          }
          const layout = 'packages/ui/src/components/Layout.svelte';
          replace(layout, '      class:md:ml-[252px]={!collapsed}\n', '');
          replace(layout, '      class:md:ml-[70px]={collapsed}\n', '');
          replace(layout, '      class:sidebar-content-expanded={!collapsed}', '      data-svadmin-content-frame\n      class:sidebar-content-expanded={!collapsed}');
          replace('packages/ui/src/components/Sidebar.svelte', '              <Button {...props} variant="ghost" size="icon" onclick={onToggle}', "              <Button {...props} aria-label={i18n.t('common.toggleSidebar')} variant=\"ghost\" size=\"icon\" onclick={onToggle}");
          replace('packages/ui/src/components.css', '[dir="rtl"] .sidebar-content-expanded {\n  margin-left: 0;\n  margin-right: 252px;\n}\n[dir="rtl"] .sidebar-content-collapsed {\n  margin-left: 0;\n  margin-right: 70px;\n}\n', '');
          replace('packages/ui/src/app.css', '@import "./styles/recipes.css";', '@import "./styles/recipes.css";\n@import "./styles/conditional-states.css";');
          replace('example/vite.config.ts', '(?:tailwind-merge|tailwind-variants|clsx)', '(?:clsx)');
          const bundle = 'scripts/check-example-bundle.ts';
          replace(bundle, "import { gzipSync } from 'node:zlib';", "import { gzipSync } from 'node:zlib';\nimport { assertExampleLayoutCss } from './example-layout-contract.js';");
          const source = readFileSync(bundle, 'utf8');
          const start = source.indexOf('for (const [label, selector]');
          const end = source.indexOf('let largestChunk');
          assert.ok(start > 0 && end > start);
          replace(bundle, source.slice(start, end), 'assertExampleLayoutCss(emittedCss);\n\n');
          for (const budget of ['1_250_000', '1_400_000', '375_000']) assert.ok(readFileSync(bundle, 'utf8').includes(budget));
          NODE
          bun test scripts/example-layout-contract.test.ts scripts/example-style-entry.test.ts scripts/tailwind-source-contract.test.ts
          bunx --no-install eslint scripts/example-layout-contract.ts scripts/example-layout-contract.test.ts scripts/check-example-bundle.ts e2e/native-sidebar-layout.spec.ts packages/ui/src/components/Sidebar.svelte packages/ui/src/components/Layout.svelte packages/ui/src/components/StepsForm.svelte packages/ui/src/components/LoginPage.svelte packages/ui/src/components/DevTools.svelte example/vite.config.ts
          git diff --check
      - name: Commit only the verified source changes to this PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add packages/ui/src/components/LoginPage.svelte packages/ui/src/components/StepsForm.svelte packages/ui/src/components/Sidebar.svelte packages/ui/src/components/DevTools.svelte packages/ui/src/components/Layout.svelte packages/ui/src/components.css packages/ui/src/app.css example/vite.config.ts scripts/check-example-bundle.ts
          test -z "$(git diff --cached --name-only -- .github)"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c core.hooksPath=/dev/null commit -m 'fix(styles): migrate conditional classes and restore native sidebar geometry'
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/feat/ui-panda-complete-20260919
          mkdir -p test-results/native-state-logs
          git rev-parse HEAD > test-results/native-state-logs/tested-commit.txt
      - name: Build and verify unchanged bundle budgets
        run: |
          bun run build:packages > test-results/native-state-logs/build.log 2>&1 || { tail -70 test-results/native-state-logs/build.log; exit 1; }
          bun run --cwd example build > test-results/native-state-logs/example.log 2>&1 || { tail -70 test-results/native-state-logs/example.log; exit 1; }
          bun run bundle:check | tee test-results/native-state-logs/bundle.log
      - name: Real browser sidebar geometry
        run: |
          bunx --no-install playwright install --with-deps chromium > test-results/native-state-logs/browser-install.log 2>&1
          bunx --no-install playwright test e2e/native-sidebar-layout.spec.ts --reporter=line > test-results/native-state-logs/sidebar.log 2>&1 || { tail -100 test-results/native-state-logs/sidebar.log; exit 1; }
          tail -20 test-results/native-state-logs/sidebar.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-state-verification
          path: |
            test-results/native-state-logs/
            test-results/**/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
