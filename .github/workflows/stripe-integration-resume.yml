name: Resume guarded Stripe integration
on:
  push:
    branches: [feat/stripe-first-design-kit-20260919]
    paths: [.github/workflows/stripe-integration-resume.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - name: Verify the transport and restore the exact reviewed source tree
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=feat/stripe-first-design-kit-20260919
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = 7f2339474f1de9ef5a5e698a0468d681b6112ea6
          mkdir -p /tmp/stripe-transport
          cp .github/workflows/stripe-product-integration.yml /tmp/stripe-transport/source.yml
          python3 <<'PY'
          import base64, gzip, hashlib, re, textwrap
          from pathlib import Path
          source = Path('/tmp/stripe-transport/source.yml').read_text()
          payload = re.search("payload = '''(.*?)'''", source, re.S).group(1)
          assert payload.count('OicO+N3') == 1
          payload = payload.replace('OicO+N3', 'OicO+3')
          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'c27b4fe38ab464df1fdda011f71e5b285f8087293ae33614d28c283d622f26b5'
          Path('/tmp/stripe-product.patch').write_bytes(patch)
          config = source.split("cat > packages/ui/panda.config.ts <<'TS'\n", 1)[1].split('\n          TS\n', 1)[0]
          Path('/tmp/panda-merge-base.ts').write_text(textwrap.dedent(config) + '\n')
          PY
          git config user.name 'svadmin automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git merge --no-commit --no-ff 8f068fb093b48cd2410b3b28a6066b567a44690e; then
            test "$(git diff --name-only --diff-filter=U)" = packages/ui/panda.config.ts
          fi
          cp /tmp/panda-merge-base.ts packages/ui/panda.config.ts
          git add packages/ui/panda.config.ts
          git rm .github/workflows/stripe-product-integration.yml .github/workflows/stripe-integration-resume.yml
          test -z "$(git diff --name-only --diff-filter=U)"
          test "$(git write-tree)" = 918c8b2f234abf8a6ef1c101ea03af8a9ccc6cd7
          git apply --check /tmp/stripe-product.patch
          git apply --index /tmp/stripe-product.patch
          git diff --cached --check
          test "$(git write-tree)" = 3f2e325dd9ce30f4b34fa79cb6b7235ddadf1aa6
          git commit -m 'feat(design): integrate Stripe-first patterns and readable status badges with current main'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD HEAD^{tree}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: stripe-transport-diagnostic
          path: /tmp/stripe-transport/source.yml
          retention-days: 1
          if-no-files-found: ignore
