name: Verify native UI merge repairs
on:
  push:
    branches: [feat/ui-panda-complete-20260919]
    paths: ['.github/workflows/ui-merge-repair-once.yml']
permissions:
  contents: read
jobs:
  repair:
    if: github.repository == 'vibeunion/svadmin' && github.ref == 'refs/heads/feat/ui-panda-complete-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Apply locally verified source repairs with exact source guards
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync, mkdirSync, renameSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const hashes = {
            'scripts/build-migrated-ui.mjs': 'ddf13413d4d6c1c9e9c60e2f25f886350ca30a9c',
            'example/src/app.css': 'ef64347b62a579ef35aee8869535df93b713b60d',
            'example/src/compatibility.css': '4a66551ace4db97123cdf6e3755bf8eac8e1627f',
            'packages/sso/src/auth-provider.test.ts': '10f74f321992ccd005f330eda3fccb2160abf083',
          };
          for (const [path, hash] of Object.entries(hashes)) assert.equal(execFileSync('git', ['hash-object', path], { encoding: 'utf8' }).trim(), hash, `Re-review concurrent changes to ${path}`);
          const edit = (path, replacements) => {
            let source = readFileSync(path, 'utf8');
            for (const [before, after] of replacements) {
              assert.equal(source.split(before).length - 1, 1, `Expected a unique edit in ${path}`);
              source = source.replace(before, after);
            }
            writeFileSync(path, source);
          };
          edit('packages/sso/src/auth-provider.test.ts', [
            ['const STORAGE_PREFIX', 'let originalWindow: PropertyDescriptor | undefined;\nlet originalFetch: PropertyDescriptor | undefined;\n\nconst STORAGE_PREFIX'],
            ["function uninstallWindow(): void {\n  Reflect.deleteProperty(globalThis, 'window');\n}", "function uninstallWindow(): void {\n  if (originalWindow) Object.defineProperty(globalThis, 'window', originalWindow);\n  else Reflect.deleteProperty(globalThis, 'window');\n}"],
            ["function uninstallFetch(): void {\n  Reflect.deleteProperty(globalThis, 'fetch');\n}", "function uninstallFetch(): void {\n  if (originalFetch) Object.defineProperty(globalThis, 'fetch', originalFetch);\n  else Reflect.deleteProperty(globalThis, 'fetch');\n}"],
            ['  beforeEach(() => {\n    installWindow();', "  beforeEach(() => {\n    originalWindow = Object.getOwnPropertyDescriptor(globalThis, 'window');\n    originalFetch = Object.getOwnPropertyDescriptor(globalThis, 'fetch');\n    installWindow();"],
            ['    uninstallFetch();\n  });', "    uninstallFetch();\n    expect(Object.getOwnPropertyDescriptor(globalThis, 'window')).toEqual(originalWindow);\n    expect(Object.getOwnPropertyDescriptor(globalThis, 'fetch')).toEqual(originalFetch);\n  });"],
          ]);
          mkdirSync('example/styles', { recursive: true });
          renameSync('example/src/compatibility.css', 'example/styles/compatibility.css');
          edit('example/src/app.css', [['"./compatibility.css"', '"../styles/compatibility.css"']]);
          edit('scripts/build-migrated-ui.mjs', [
            ['example/src/compatibility.css', 'example/styles/compatibility.css'],
            ['  else writeFileSync(outputPath, css);', '  else {\n    mkdirSync(dirname(outputPath), { recursive: true });\n    writeFileSync(outputPath, css);\n  }'],
          ]);
          assert.equal(execFileSync('git', ['hash-object', 'example/styles/compatibility.css'], { encoding: 'utf8' }).trim(), hashes['example/src/compatibility.css']);
          NODE
          bun test scripts/stripe-first-refactor-contract.test.ts packages/sso/src/auth-provider.test.ts packages/create-svadmin/src/infer-command.test.ts
          node scripts/build-migrated-ui.mjs example --check
          bunx --no-install eslint scripts/build-migrated-ui.mjs packages/sso/src/auth-provider.test.ts
          git diff --check
      - name: Commit only verified source changes to the existing PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/feat/ui-panda-complete-20260919
          git add scripts/build-migrated-ui.mjs packages/sso/src/auth-provider.test.ts example/src/app.css example/src/compatibility.css example/styles/compatibility.css
          test -z "$(git diff --cached --name-only -- .github)"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c core.hooksPath=/dev/null commit -m 'fix(styles): separate generated styles and restore test globals'
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/feat/ui-panda-complete-20260919
          mkdir -p test-results/ui-merge-logs
          git rev-parse HEAD | tee test-results/ui-merge-logs/tested-commit.txt
          git diff --check 510d0b5afe00651916f841a6a4218654d3d6e150...HEAD
      - name: Build workspace packages
        run: |
          bun run build:packages > test-results/ui-merge-logs/build.log 2>&1 || { tail -80 test-results/ui-merge-logs/build.log; exit 1; }
      - name: Full repository tests with bounded diagnostics
        id: tests
        continue-on-error: true
        run: |
          bun run test > test-results/ui-merge-logs/tests.log 2>&1 || { grep -nE '\(fail\)|FAIL|Error:|error:' test-results/ui-merge-logs/tests.log | tail -50; tail -50 test-results/ui-merge-logs/tests.log; exit 1; }
          tail -35 test-results/ui-merge-logs/tests.log
      - name: Example, docs, and strict project verification
        id: types
        continue-on-error: true
        run: |
          bun run --cwd example build > test-results/ui-merge-logs/example.log 2>&1 || { tail -65 test-results/ui-merge-logs/example.log; exit 1; }
          bun run docs:build > test-results/ui-merge-logs/docs.log 2>&1 || { tail -65 test-results/ui-merge-logs/docs.log; exit 1; }
          bun run typecheck > test-results/ui-merge-logs/types.log 2>&1 || { tail -100 test-results/ui-merge-logs/types.log; exit 1; }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-merge-repair-logs
          path: test-results/ui-merge-logs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce all checks
        if: always()
        run: |
          test '${{ steps.tests.outcome }}' = success
          test '${{ steps.types.outcome }}' = success
