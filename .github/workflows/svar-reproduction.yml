name: SVAR offline reproduction
on:
  pull_request:
    paths: ['.github/workflows/svar-reproduction.yml']
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: npm ci --prefix scripts/fixtures/svar-grid --ignore-scripts --no-audit --no-fund
      - name: Archive tracked sources and installed public dependencies only
        run: |
          mkdir -p /tmp/svar-reproduction
          git archive HEAD | gzip -1 > /tmp/svar-reproduction/source.tar.gz
          find . -type d -name node_modules -prune -print0 > /tmp/dependency-paths
          tar --null -T /tmp/dependency-paths --exclude='*/.cache/*' -cf - | gzip -1 > /tmp/svar-reproduction/dependencies.tar.gz
          cp "$(command -v bun)" /tmp/svar-reproduction/bun
          git rev-parse HEAD > /tmp/svar-reproduction/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: svar-offline-reproduction
          path: /tmp/svar-reproduction
          compression-level: 0
          retention-days: 1
