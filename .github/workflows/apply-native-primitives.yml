name: Apply native primitive migration

on:
  push:
    branches: [feat/no-tailwind-native-primitives]
    paths: ['.github/workflows/apply-native-primitives.yml']

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.repository == 'vibeunion/svadmin' && github.ref == 'refs/heads/feat/no-tailwind-native-primitives'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/no-tailwind-native-primitives
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Apply reviewed patch only to exact preimages, then remove this writer
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, json, lzma, pathlib, subprocess, tempfile
          expected = json.loads(r'''{
            ".github/workflows/native-primitives.yml": null,
            "README.md": "284a44c5744b30f649843a121f6286d30ed28756",
            "docs/ai-elements-static-css.md": "b07ed606a9311e4f6f66128cf9644b61a6f35ac2",
            "docs/components/base-ui.md": "f0675011bc903ea7af351fe9e17b16e203847c7d",
            "docs/components/theming.md": "1d682bc32493ae79823c1781485a92432256278c",
            "docs/no-tailwind-component-migration.md": null,
            "packages/ai-elements/src/ai.theme.css": "96524f4a4445675c7dfc5d1ee85c18ea9e343245",
            "packages/create-svadmin/README.md": "3a9e1193c2652641fa1d7c3f6253ef33dfcba9aa",
            "packages/ui/README.md": "3aa7d75cb4a50eba14cb8e4c8f9d46b99552cd2b",
            "packages/ui/design/primitive-recipes.ts": null,
            "packages/ui/package.json": "b7f820cc843321cbcfcdcf10f8a69e2ccaa5182a",
            "packages/ui/panda.config.ts": "f4573f9a3e6048f777cce8f6f5d93982d256bafe",
            "packages/ui/scripts/build-static-css.mjs": "3ca44233b10bae069fb747e32c4eec0f76170c62",
            "packages/ui/scripts/flatten-panda-css.mjs": "0be33c01d1047e6923b0c429050cc4e8f92ba582",
            "packages/ui/scripts/native-css-entries.test.mjs": null,
            "packages/ui/scripts/panda-css.test.mjs": "807799cd1eb5b04c123e653480bacc3a33ff7600",
            "packages/ui/scripts/panda-primitive-runtime.test.mjs": null,
            "packages/ui/scripts/primitive-css-layers.mjs": null,
            "packages/ui/scripts/primitive-css-layers.test.mjs": null,
            "packages/ui/scripts/primitive-recipes.test.mjs": null,
            "packages/ui/scripts/retire-primitive-fallbacks.mjs": null,
            "packages/ui/scripts/retire-primitive-fallbacks.test.mjs": null,
            "packages/ui/scripts/static-css.test.mjs": "bfb73b4d3b5de8bce977128f383d30939676a45d",
            "packages/ui/src/components/ui/badge/badge-variants.ts": "04a1c86cea5c06bc65be843922769ce4b6cc9781",
            "packages/ui/src/components/ui/button/button-variants.ts": "9d7cd2ef77aa1a303683bbcc3cc2306ca8dcb0e7",
            "packages/ui/src/components/ui/input/input.svelte": "05be301190210db6d5cff37c05ae4a58cbb1d08f",
            "packages/ui/src/components/ui/textarea/textarea.svelte": "06d57c0ebdb1a80f992bd0908691fefb8d45f2ce",
            "packages/ui/src/recipes.ts": "6f00fa7772b2175eb6fb2903b513e11e8731442a",
            "scripts/check-no-tailwind.mjs": "1df3d5c73690e832cf28ad603a2989facfacddab",
            "scripts/check-package-packs.ts": "0717423a0161110e122123a0a4b643b57d2e16c5",
            "scripts/fix-css.js": "7bd35d0046a0b1c04c3678701a7c3509f257e02f",
            "scripts/no-tailwind-contract.mjs": null,
            "scripts/no-tailwind-contract.test.mjs": null
          }''')
          pieces = [f'.github/migrations/native-primitives/{i}.b64' for i in (1, 2, 3)]
          encoded = ''.join(pathlib.Path(name).read_text().strip() for name in pieces)
          patch = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '17759b8351a64dd7e6f3c419df72e55317897cabebf66225235b5739a89c722d'
          # Keep the upstream disabled-state fix; update only the matching context line.
          old_context = b' \t\tdata-disabled={attributes.disabled ? "true" : undefined}'
          new_context = b' \t\tdata-disabled={disabled ? "true" : undefined}'
          assert patch.count(old_context) == 1
          patch = patch.replace(old_context, new_context)
          # Preserve the concurrent conditional-class regression suite in both diff lines.
          script_context = b'scripts/panda-css-isolation.test.mjs'
          assert patch.count(script_context) == 2
          patch = patch.replace(script_context, script_context + b' scripts/conditional-css.test.mjs')
          for name, sha in expected.items():
              path = pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              if sha is None:
                  assert not path.exists(), f'New path already exists: {name}'
              else:
                  actual = subprocess.check_output(['git', 'hash-object', name], text=True).strip()
                  assert actual == sha, f'Concurrent modification: {name}'
          with tempfile.NamedTemporaryFile() as source:
              source.write(patch)
              source.flush()
              names = subprocess.check_output(['git', 'apply', '--numstat', source.name], text=True)
              changed = {line.split('\t', 2)[2] for line in names.splitlines()}
              assert changed == set(expected), 'Patch escapes the approved file set'
              subprocess.run(['git', 'apply', '--check', '--index', source.name], check=True)
              subprocess.run(['git', 'apply', '--index', source.name], check=True)
          writer = '.github/workflows/apply-native-primitives.yml'
          for name in [writer, *pieces]: pathlib.Path(name).unlink()
          subprocess.run(['git', 'add', '--', writer, *pieces], check=True)
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert staged == set(expected) | {writer, *pieces}
          PYCODE
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(ui): adopt Panda primitives and enforce native CSS boundaries'
          git push origin HEAD:refs/heads/feat/no-tailwind-native-primitives
          mkdir -p "$RUNNER_TEMP/native-primitives/logs"
          git rev-parse HEAD | tee "$RUNNER_TEMP/native-primitives/commit.txt"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Strict no-Tailwind dependency contract
        id: audit
        continue-on-error: true
        run: node scripts/check-no-tailwind.mjs 2>&1 | tee "$RUNNER_TEMP/native-primitives/logs/audit.log"
      - name: Build real component packages
        id: build
        continue-on-error: true
        run: |
          bun run --cwd packages/ai-elements build 2>&1 | tee "$RUNNER_TEMP/native-primitives/logs/ai-build.log"
          bun run --cwd packages/ui build 2>&1 | tee "$RUNNER_TEMP/native-primitives/logs/ui-build.log"
          bun run --cwd packages/surface build 2>&1 | tee "$RUNNER_TEMP/native-primitives/logs/surface-build.log"
      - name: Native CSS and generated recipe contracts
        id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: bun run --cwd packages/ui test:css 2>&1 | tee "$RUNNER_TEMP/native-primitives/logs/tests.log"
      - name: Standalone generated runtime and declarations
        id: runtime
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: node scripts/check-panda-runtime.mjs 2>&1 | tee "$RUNNER_TEMP/native-primitives/logs/runtime.log"
      - name: Surface type checks
        id: types
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: bun run --cwd packages/surface check 2>&1 | tee "$RUNNER_TEMP/native-primitives/logs/types.log"
      - name: Actual Chromium compatibility matrix
        id: browser
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          bunx --no-install playwright install --with-deps chromium
          node scripts/check-panda-browser.mjs 2>&1 | tee "$RUNNER_TEMP/native-primitives/logs/browser.log"
          node scripts/check-conditional-styles.mjs 2>&1 | tee "$RUNNER_TEMP/native-primitives/logs/conditional-styles.log"
      - name: Archive evidence for the applied commit, not the workflow bootstrap SHA
        if: always()
        env:
          RESULTS: ${{ toJSON(steps) }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-primitives"
          git rev-parse HEAD > "$RUNNER_TEMP/native-primitives/commit.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/native-primitives/source.tar.gz" HEAD
          printf '%s\n' "$RESULTS" > "$RUNNER_TEMP/native-primitives/results.json"
          if test -d packages/ui/dist; then tar -czf "$RUNNER_TEMP/native-primitives/ui-dist.tar.gz" -C packages/ui dist; fi
          if test -d packages/surface/dist; then tar -czf "$RUNNER_TEMP/native-primitives/surface-dist.tar.gz" -C packages/surface dist; fi
          if test -d docs/pr-evidence/panda-styles; then cp -R docs/pr-evidence/panda-styles "$RUNNER_TEMP/native-primitives/"; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-primitives-applied-evidence
          path: ${{ runner.temp }}/native-primitives/
          retention-days: 14
      - name: Enforce all acceptance results without allowing the transitive dependency
        if: steps.audit.outcome != 'success' || steps.build.outcome != 'success' || steps.tests.outcome != 'success' || steps.runtime.outcome != 'success' || steps.types.outcome != 'success' || steps.browser.outcome != 'success'
        run: exit 1
