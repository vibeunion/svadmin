name: Restore processing labels

on:
  push:
    branches: [feat/panda-tokens-no-tailwind]
    paths: ['.github/workflows/restore-panda-processing-labels.yml']

permissions:
  contents: write

jobs:
  restore:
    if: github.repository == 'vibeunion/svadmin' && github.ref == 'refs/heads/feat/panda-tokens-no-tailwind'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Apply the two bounded source corrections
        run: |
          test "$(git hash-object packages/core/src/i18n.svelte.ts)" = '521392b00ace3745903604ff24f95ee26e1272fb'
          test "$(git hash-object scripts/stripe-first-refactor-contract.test.ts)" = 'd8a813e6cd6aaf410e35fc59283088c9a3f7b974'
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          path = Path('packages/core/src/i18n.svelte.ts')
          text = path.read_text(encoding='utf-8')
          assert text.count("'common.processing'") == 0
          for anchor, label in [
              ("    'common.list': '列表',", "    'common.processing': '处理中...',"),
              ("    'common.list': 'List',", "    'common.processing': 'Processing...',"),
          ]:
              assert text.count(anchor) == 1
              text = text.replace(anchor, anchor + '\n' + label)
          assert text.count("'common.processing'") == 2
          path.write_text(text, encoding='utf-8')
          assert subprocess.check_output(['git', 'diff', '--numstat', '--', str(path)], text=True).strip() == '2\t0\t' + str(path)
          path = Path('scripts/stripe-first-refactor-contract.test.ts')
          text = path.read_text(encoding='utf-8')
          anchor = "import { relative, resolve } from 'node:path';"
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + "\nimport { isFrozenCompatibilityCss } from './frozen-css-compatibility.js';")
          anchor = "          readFileSync(path, 'utf8')\n            .split('\\n')"
          assert text.count(anchor) == 1
          text = text.replace(anchor, "          const source = readFileSync(path, 'utf8');\n          if (isFrozenCompatibilityCss(rel, source)) continue;\n          source.split('\\n')")
          path.write_text(text, encoding='utf-8')
          assert subprocess.check_output(['git', 'diff', '--numstat', '--', str(path)], text=True).strip() == '4\t2\t' + str(path)
          PY
          git add -- packages/core/src/i18n.svelte.ts scripts/stripe-first-refactor-contract.test.ts
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(styles): restore translations and bound frozen CSS exceptions'
          git push origin HEAD:refs/heads/feat/panda-tokens-no-tailwind
