name: PR integration review workspace

# 仅供本次合并审查使用，不进入主分支；不写任何业务数据或分支。
on:
  push:
    branches: [review/merge-readiness-20260919]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect current main and PR trees without changing remote refs
        shell: bash
        run: |
          set -euo pipefail
          git branch snapshot-main HEAD
          git log -1 --format='MAIN %H %s'
          for number in 434 436 437 438 441; do
            git fetch -q origin "refs/pull/$number/head:refs/heads/snapshot-pr-$number"
          done
          python3 <<'PY'
          import subprocess, re
          def git(*args):
            return subprocess.check_output(['git', *args], text=True)
          for number in [434,436,437,438,441]:
            ref=f'snapshot-pr-{number}'
            print(f'\n=== PR {number} {git("rev-parse",ref).strip()} ===', flush=True)
            common=git('merge-base','snapshot-main',ref).strip()
            print('MERGE BASE', common)
            result=subprocess.run(['git','merge-tree','--write-tree','snapshot-main',ref],capture_output=True,text=True)
            if result.returncode not in (0,1):
              raise RuntimeError(result.stderr)
            print(result.stdout,flush=True)
            tree=result.stdout.splitlines()[0]
            paths=git('diff','--name-only',common,ref).splitlines()
            identical=[]; distinct=[]
            for path in paths:
              a=subprocess.run(['git','rev-parse',f'snapshot-main:{path}'],capture_output=True,text=True)
              b=subprocess.run(['git','rev-parse',f'{ref}:{path}'],capture_output=True,text=True)
              (identical if a.returncode==b.returncode==0 and a.stdout==b.stdout else distinct).append(path)
            print('IDENTICAL TO MAIN:', '\n'.join(identical))
            print('DIFFERENT FROM MAIN:', '\n'.join(distinct))
            conflicts=sorted(set(re.findall(r'^\d+ [0-9a-f]+ [123]\t(.+)$',result.stdout,re.M)))
            for path in conflicts:
              print(f'--- {path} CONFLICT EXCERPTS ---')
              text=git('show',f'{tree}:{path}')
              lines=text.splitlines(); indexes=set()
              for i,line in enumerate(lines):
                if line.startswith('<<<<<<<'):
                  j=i+1
                  while j<len(lines) and not lines[j].startswith('>>>>>>>'): j+=1
                  indexes.update(range(max(0,i-5),min(len(lines),j+6)))
              for i in sorted(indexes):print(f'{i+1}: {lines[i]}')
          PY
