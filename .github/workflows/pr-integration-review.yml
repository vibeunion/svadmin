name: PR integration review workspace

# 临时审查分支：只保留已验证的截图，不进入 main，不修改功能分支。
on:
  push:
    branches: [review/merge-readiness-20260919]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 34311272a1b5dd556049645e57d108123a9902d7
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35450546994
          artifact-ids: '10585698947'
          merge-multiple: true
          path: ${{ runner.temp }}/content-evidence
      - name: Verify provenance and retain only real candidate screenshots
        env:
          EVIDENCE_ROOT: ${{ runner.temp }}/content-evidence
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, json, hashlib, shutil, subprocess
          from pathlib import Path
          root=Path(os.environ['EVIDENCE_ROOT'])
          reports=list(root.rglob('report.json'))
          assert len(reports)==1, reports
          report_path=reports[0]
          report=json.loads(report_path.read_text())
          assert report['head']=='d81182b7f5d02c67843ef21ce10e5f671aa7938d'
          assert report['errors']==[]
          assert len(report['cases'])==48 and all(case['passed'] for case in report['cases'])
          for path, expected in report['candidateSources'].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==expected, path
          target=Path('docs/pr-evidence/content-recipes-34311272')
          target.mkdir(parents=True, exist_ok=False)
          kept=[]
          for width,height in [(1440,900),(1920,1080)]:
              case=next(case for case in report['cases'] if case['viewport']=={'width':width,'height':height} and case['theme']=='light' and case['width']=='default' and not case.get('flat') and not case.get('nested') and not case.get('rtl'))
              source=report_path.parent/(case['id']+'-candidate.png')
              data=source.read_bytes()
              assert data.startswith(b'\x89PNG\r\n\x1a\n')
              assert hashlib.sha256(data).hexdigest()==case['candidatePngSha256']
              filename=f'{width}x{height}-candidate.png'
              (target/filename).write_bytes(data)
              kept.append({'file':filename,'viewport':case['viewport'],'scene':case['id'],'sha256':case['candidatePngSha256'],'capture':'stage locator, not a full viewport bitmap'})
          shutil.copyfile(report_path,target/'report.json')
          (target/'provenance.json').write_text(json.dumps({'sourceHead':'34311272a1b5dd556049645e57d108123a9902d7','testedMergeHead':report['head'],'workflowRun':35450546994,'artifactId':10585698947,'images':kept},indent=2)+'\n')
          subprocess.run(['git','diff','--check'],check=True)
          print(json.dumps({'cases':len(report['cases']),'images':kept},indent=2))
          PY
          git switch -c evidence/content-recipes-34311272-merge-review
          git add -- docs/pr-evidence/content-recipes-34311272
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: retain verified content recipe candidate screenshots'
          git push origin HEAD:refs/heads/evidence/content-recipes-34311272-merge-review
          git log -1 --format='EVIDENCE_COMMIT %H'
  inspect-upload-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e594440ad6e143727fb5b8d81f0368d9a9024385
          fetch-depth: 0
          persist-credentials: false
      - name: Show only non-conflicted combined files for PR 437
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin 19c8b94c31b6123db1060dc494fd8e6de42775eb
          python3 <<'PY'
          import subprocess
          result=subprocess.run(['git','merge-tree','--write-tree','HEAD','19c8b94c31b6123db1060dc494fd8e6de42775eb'],capture_output=True,text=True)
          assert result.returncode==1
          tree=result.stdout.splitlines()[0]
          for path in ['packages/ui/src/components/TreeSelect.svelte','packages/ui/src/components/resource-workspace.test-host.svelte','packages/ui/src/components/resource-workspace.test.svelte.ts']:
              content=subprocess.check_output(['git','show',f'{tree}:{path}'],text=True)
              assert '<<<<<<<' not in content
              print('\nCOMBINED_FILE',path,'\n'+content+'\nEND_COMBINED_FILE',flush=True)
          PY
