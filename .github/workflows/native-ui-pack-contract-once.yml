name: Finalize native UI package contracts
on:
  push:
    branches: [feat/ui-panda-complete-20260919]
    paths: ['.github/workflows/native-ui-pack-contract-once.yml']
permissions:
  contents: read
jobs:
  finalize:
    if: github.repository == 'vibeunion/svadmin' && github.ref == 'refs/heads/feat/ui-panda-complete-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Replace only reviewed obsolete CSS assertions
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import ts from 'typescript';
          const path = 'scripts/check-package-packs.ts';
          assert.equal(execFileSync('git', ['hash-object', path], { encoding: 'utf8' }).trim(), '0717423a0161110e122123a0a4b643b57d2e16c5', 'Re-review concurrent pack-contract edits');
          let text = readFileSync(path, 'utf8');
          const source = ts.createSourceFile(path, text, ts.ScriptTarget.Latest, true);
          const declaration = source.statements.flatMap(s => ts.isVariableStatement(s) ? [...s.declarationList.declarations] : []).find(d => ts.isIdentifier(d.name) && d.name.text === 'expectations');
          assert.ok(declaration && ts.isArrayLiteralExpression(declaration.initializer));
          const edits = [];
          const find = (node, key) => node.properties.find(p => ts.isPropertyAssignment(p) && p.name?.text === key);
          const forbidden = ['@theme', '@source', '@apply', '@utility', '@custom-variant', '@import "tailwindcss"'];
          const targets = {
            '@svadmin/ai-elements': {
              required: ['dist/ai.theme.css', 'dist/classnames.js', 'dist/classnames.d.ts', 'vendor/streamdown/index.js', 'vendor/streamdown/index.d.ts', 'vendor/streamdown/theme.js', 'vendor/streamdown/LICENSE', 'vendor/streamdown/provenance.json', 'vendor/streamdown/README.svadmin.md'],
              assertions: [
                { path: 'dist/ai.theme.css', includes: ['@import "./ai.css";'], excludes: forbidden },
                { path: 'vendor/streamdown/theme.js', includes: ["from '../../dist/classnames.js'"], excludes: ["from 'tailwind-merge'", 'twMerge('] },
              ],
            },
            '@svadmin/ui': {
              required: ['dist/classnames.js', 'dist/classnames.d.ts'],
              assertions: ['app.css', 'app.theme.css'].map(name => ({ path: `dist/${name}`, includes: [':root', '.svadmin-theme', '--color-primary: var(--primary);', '.svadmin-button'], excludes: forbidden })),
            },
          };
          let visited = 0;
          for (const object of declaration.initializer.elements) {
            assert.ok(ts.isObjectLiteralExpression(object));
            const name = find(object, 'name')?.initializer;
            assert.ok(name && ts.isStringLiteral(name));
            if (!Object.hasOwn(targets, name.text)) continue;
            const target = targets[name.text];
            const required = find(object, 'requiredFiles').initializer;
            const assertions = find(object, 'contentAssertions').initializer;
            assert.ok(ts.isArrayLiteralExpression(required) && ts.isArrayLiteralExpression(assertions));
            const previous = required.elements.map(item => { assert.ok(ts.isStringLiteral(item)); return item.text; });
            edits.push({ start: required.getStart(source), end: required.end, value: JSON.stringify([...new Set([...previous, ...target.required])], null, 2) });
            edits.push({ start: assertions.getStart(source), end: assertions.end, value: JSON.stringify(target.assertions, null, 2) });
            visited++;
          }
          assert.equal(visited, 2);
          for (const edit of edits.sort((a, b) => b.start - a.start)) text = text.slice(0, edit.start) + edit.value + text.slice(edit.end);
          assert.equal(ts.createSourceFile(path, text, ts.ScriptTarget.Latest, true).parseDiagnostics.length, 0);
          writeFileSync(path, text);
          const packagePath = 'packages/ai-elements/package.json';
          const manifest = JSON.parse(readFileSync(packagePath, 'utf8'));
          assert.ok(Array.isArray(manifest.sideEffects));
          if (!manifest.sideEffects.includes('./vendor/**/*.css')) manifest.sideEffects.push('./vendor/**/*.css');
          writeFileSync(packagePath, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          git diff --check
          bunx --no-install eslint scripts/check-package-packs.ts
          node scripts/check-style-boundary.mjs --source
      - name: Commit only the two reviewed code files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/feat/ui-panda-complete-20260919
          git add scripts/check-package-packs.ts packages/ai-elements/package.json
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c core.hooksPath=/dev/null commit -m 'fix(styles): verify compiler-free tarballs and preserve vendor CSS side effects'
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/feat/ui-panda-complete-20260919
      - name: Build and verify native package boundaries
        run: |
          mkdir -p test-results/native-ui-final
          bun run build:packages > test-results/native-ui-final/build.log 2>&1 || { tail -80 test-results/native-ui-final/build.log; exit 1; }
          node scripts/check-style-boundary.mjs
          git diff --exit-code -- bun.lock
      - name: Execute existing full tarball and isolated-consumer matrix
        run: |
          bun run pack:check > test-results/native-ui-final/packs.log 2>&1 || { tail -100 test-results/native-ui-final/packs.log; exit 1; }
          tail -45 test-results/native-ui-final/packs.log
      - name: Explicit strict package typechecks
        if: ${{ !cancelled() }}
        run: |
          mkdir -p test-results/native-ui-final
          status=0
          for package in ui ai-elements; do
            bunx --no-install svelte-check --tsgo-experimental-api --tsconfig "packages/$package/tsconfig.json" --threshold error > "test-results/native-ui-final/$package-types.log" 2>&1 || status=1
            tail -60 "test-results/native-ui-final/$package-types.log"
          done
          exit "$status"
      - name: Check complete PR whitespace against main
        if: ${{ !cancelled() }}
        run: |
          git fetch --no-tags --depth=1 origin main
          git diff --check FETCH_HEAD HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-ui-final-package-logs
          path: test-results/native-ui-final/
          if-no-files-found: ignore
          retention-days: 14
