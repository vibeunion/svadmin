name: Attach verified Lite UI evidence
on:
  push:
    branches: [codex/permission-catalog-adapter]
    paths: [.github/workflows/pr425-ui-evidence.yml]
permissions:
  contents: read
  pull-requests: write
jobs:
  attach:
    if: github.repository == 'vibeunion/svadmin' && github.ref == 'refs/heads/codex/permission-catalog-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify whitespace in both current PR diffs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --depth=1 origin refs/heads/main:refs/remotes/origin/main refs/heads/release-please--branches--main:refs/remotes/origin/release-please--branches--main refs/heads/codex/permission-catalog-adapter:refs/remotes/origin/codex/permission-catalog-adapter
          git diff --check origin/main origin/release-please--branches--main
          git diff --check origin/main origin/codex/permission-catalog-adapter
          echo "HEAD_424=$(git rev-parse origin/release-please--branches--main)" >> "$GITHUB_ENV"
          echo "HEAD_425=$(git rev-parse origin/codex/permission-catalog-adapter)" >> "$GITHUB_ENV"
      - name: Verify captured PNGs and matching sources before appending evidence
        uses: actions/github-script@v9
        with:
          script: |
            const assert = require('node:assert/strict');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const evidence = '9e5ce35fdf212f25d56b1dad6ef9e2db2ea0f168';
            const root = `https://raw.githubusercontent.com/${owner}/${repo}/${evidence}/docs/pr-evidence/lite-file-picker`;
            for (const [width, height] of [[1440, 900], [1920, 1080]]) {
              const { data } = await github.rest.repos.getContent({ owner, repo, ref: evidence, path: `docs/pr-evidence/lite-file-picker/${width}x${height}.png` });
              assert.equal(data.type, 'file');
              assert.equal(data.encoding, 'base64');
              const bytes = Buffer.from(data.content, 'base64');
              assert.ok(bytes.subarray(0, 8).equals(Buffer.from([137, 80, 78, 71, 13, 10, 26, 10])));
              assert.equal(bytes.readUInt32BE(16), width);
              assert.equal(bytes.readUInt32BE(20), height);
            }
            for (const number of [425, 424]) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              assert.equal(pr.state, 'open');
              assert.equal(pr.head.sha, process.env[`HEAD_${number}`], 'PR moved after diff verification');
              for (const [path, sha] of [
                ['packages/lite/src/lite.css', 'e62ea05ce9bc8539b2b52fd2ee031d21b284a182'],
                ['packages/lite/src/components/LiteFileInput.svelte', '0a0824469ac25c03ab689553e4cf073fd0f0f9c6'],
              ]) {
                const { data } = await github.rest.repos.getContent({ owner, repo, ref: pr.head.sha, path });
                assert.equal(data.sha, sha, 'Capture does not match the current component/CSS');
              }
              const marker = '<!-- lite-file-picker-evidence:start -->';
              if ((pr.body || '').includes(marker)) throw new Error('Evidence block already exists; refusing duplicate edits');
              const block = `\n\n${marker}\n## 本轮修复与 UI 证据\n\n已修复词典测试的 Bun/Vitest 运行时归属，以及 Lite 文件选择器的 gap、focus-visible、inset 兼容问题；保留原有严格类型、源码/发布 CSS、SSR 门禁。截图直接挂载真实 LiteFileInput 组件，并校验与本 PR 的组件/CSS blob 完全一致。\n\n### 状态矩阵 / State matrix\n\n| 状态 | 已验证内容 |\n| --- | --- |\n| 空值 | 原生文件输入及空文件提示 |\n| 键盘焦点 | Tab 导航与可见焦点环 |\n| 已选文件 | 真实 File 输入触发 invoice.csv 文案更新 |\n| 禁用 | 原生 disabled 属性生效 |\n| 校验错误 | 错误状态红色边框 |\n| 长文件名 | 固定宽度内省略，无页面横向溢出 |\n| 加载、提交、权限业务 | 该组件不提供这些流程，本证据不作模拟通过声明 |\n\n- [x] git diff --check：已对本 PR 当前分支与 main 的完整差异执行。\n- 浏览器验证：Chromium 组件渲染；不是 IE11 浏览器引擎、完整应用端到端或服务端授权验证。\n- [运行和源码哈希记录](https://github.com/${owner}/${repo}/blob/${evidence}/docs/pr-evidence/lite-file-picker/provenance.json)\n- [采集工作流](https://github.com/${owner}/${repo}/actions/runs/35406932706)\n\n### 1440x900\n![Lite file input 1440x900](${root}/1440x900.png)\n\n### 1920x1080\n![Lite file input 1920x1080](${root}/1920x1080.png)\n\n完整 CI 仍以当前有效提交的最终结果为准，定向测试或截图通过不等同全部通过。\n<!-- lite-file-picker-evidence:end -->\n`;
              await github.rest.pulls.update({ owner, repo, pull_number: number, body: (pr.body || '') + block });
              core.info(`Appended verified evidence to #${number} without replacing its existing description`);
            }
