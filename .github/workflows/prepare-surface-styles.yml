# Temporary bootstrap for PR #426. Removed after the generated files are reviewed.
name: Prepare Surface styles
on:
  push:
    branches: [codex/openui-surface-contracts-20260919]
    paths:
      - 'packages/surface/package.json'
      - 'packages/surface/panda.config.ts'
      - 'packages/surface/scripts/build-editor-styles.mjs'
      - '.github/workflows/prepare-surface-styles.yml'
permissions:
  contents: read
jobs:
  generate:
    if: github.repository == 'vibeunion/svadmin'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Resolve added build-only dependency
        run: bun install --ignore-scripts
      - name: Generate finite Panda styles and verify repeatability
        run: |
          bun run --cwd packages/surface styles:build
          bun run --cwd packages/surface styles:check
          bun install --frozen-lockfile --ignore-scripts
      - name: Commit only generated artifacts to the unchanged feature head
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const cp = require('node:child_process');
            const branch = 'codex/openui-surface-contracts-20260919';
            if (context.ref !== `refs/heads/${branch}`) throw new Error('Unexpected branch');
            const allow = ['bun.lock', 'packages/surface/src/styles/editor.css', 'packages/surface/src/styles/editor.generated.ts'];
            const changed = cp.execFileSync('git', ['diff', '--name-only'], {encoding:'utf8'}).trim().split('\n').filter(Boolean);
            if (changed.some(path => !allow.includes(path))) throw new Error('Unexpected tracked changes');
            const {owner, repo} = context.repo;
            const current = await github.rest.git.getRef({owner, repo, ref:`heads/${branch}`});
            if (current.data.object.sha !== context.sha) throw new Error('Feature branch advanced; refusing to overwrite');
            const base = await github.rest.git.getCommit({owner, repo, commit_sha:context.sha});
            const tree = [];
            for (const path of allow) {
              const blob = await github.rest.git.createBlob({owner, repo, encoding:'base64', content:fs.readFileSync(path).toString('base64')});
              tree.push({path, mode:'100644', type:'blob', sha:blob.data.sha});
            }
            const nextTree = await github.rest.git.createTree({owner, repo, base_tree:base.data.tree.sha, tree});
            if (nextTree.data.sha === base.data.tree.sha) return;
            const commit = await github.rest.git.createCommit({owner, repo, tree:nextTree.data.sha, parents:[context.sha], message:'build(surface): lock Panda and generate finite editor styles'});
            await github.rest.git.updateRef({owner, repo, ref:`heads/${branch}`, sha:commit.data.sha, force:false});
            core.info(`Generated artifacts commit: ${commit.data.sha}`);
