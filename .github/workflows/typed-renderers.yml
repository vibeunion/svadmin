name: Typed renderer contracts
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/ui/**'
      - 'packages/core/**'
      - 'scripts/fixtures/ui-rendering/**'
      - '.github/workflows/typed-renderers.yml'
      - 'bun.lock'
      - 'package.json'
      - 'scripts/check-type-contracts.ts'
      - 'tsconfig*.json'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Lint new adapters and fixtures
        run: bun run eslint packages/ui/src/rendering scripts/fixtures/ui-rendering --max-warnings 0
      - name: Runtime and native snippet regression tests
        if: success() || failure()
        run: bun run --cwd packages/ui test src/rendering/rendering.test.ts
      - name: Positive and negative TypeScript contracts
        if: success() || failure()
        run: node node_modules/@typescript/native/bin/tsc --noEmit --pretty false -p scripts/fixtures/ui-rendering/tsconfig.json
      - name: Compile native Svelte consumers
        if: success() || failure()
        run: bun run svelte-check --tsgo-experimental-api --tsconfig scripts/fixtures/ui-rendering/tsconfig.svelte.json --fail-on-warnings
      - name: Build and verify public rendering subpath
        if: success() || failure()
        run: |
          bun run --cwd packages/ai-elements build
          bun run --cwd packages/ui build
          bun -e 'const api = await import("@svadmin/ui/rendering"); if (typeof api.createResourceRenderers !== "function" || typeof api.componentView !== "function") throw new Error("Missing rendering exports"); console.info("Public rendering subpath OK");'
      - name: Check diff whitespace
        if: success() || failure()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA...HEAD"
