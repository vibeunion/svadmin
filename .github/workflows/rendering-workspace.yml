name: Prepare verified business migration
on:
  push:
    branches: [feat/typed-svelte-renderers]
    paths: [.github/workflows/rendering-workspace.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'vibeunion/svadmin' && github.ref == 'refs/heads/feat/typed-svelte-renderers'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retrieve immutable reviewed patch pieces
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const pieces = [
              '5d0e461c7da8dcd927e7e80efa1e78957febbd28',
              'c93446dd351df6ead1cf21c82a9cc3d3c72242b3',
              '21166990af7992ab9abdd11f6bf04169650a5de3',
              '1cb0303c24296e8a0836dbc6dad4d4192fd2f521',
              '47e0e2bfb71e037c8a2c0baf5e64f9e4d2879074',
            ];
            let text = '';
            for (const file_sha of pieces) {
              const { data } = await github.rest.git.getBlob({ ...context.repo, file_sha });
              if (data.encoding !== 'base64' || data.size > 8000) throw new Error('Unexpected patch blob');
              text += Buffer.from(data.content, 'base64').toString('utf8');
            }
            fs.writeFileSync('/tmp/rendering-input.b64', text);
      - name: Verify every original and resulting file before staging
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd().resolve()
          data = base64.b64decode(pathlib.Path('/tmp/rendering-input.b64').read_text(), validate=True)
          decoder = lzma.LZMADecompressor()
          raw = decoder.decompress(data, max_length=1_000_001)
          assert decoder.eof and not decoder.unused_data and len(raw) == 106211
          assert hashlib.sha256(raw).hexdigest() == 'a1ed1477a946b2786705c70af0db5795be1b5b7f9ad08a6649c5cb24b6c2df93'
          manifest = json.loads(raw)
          assert manifest['base'] == '4cbc00bc08e01d415aec1405d54b89f8a760710b'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == 'e82e44d2ebb9806e58ed7b29ace1a40caabe119a'
          assert len(manifest['files']) == 55
          seen = set()
          updates = []
          for entry in manifest['files']:
              name = entry['path']
              assert name not in seen
              seen.add(name)
              path = root / name
              assert not path.is_symlink() and path.resolve().is_relative_to(root)
              assert '..' not in pathlib.PurePosixPath(name).parts
              assert name.startswith(('example/', 'packages/ui/', 'scripts/fixtures/ui-rendering/', 'docs/typed-rendering')) or name in ['.github/workflows/typed-renderers.yml', 'e2e/business-rendering.spec.ts', 'playwright.rendering.config.ts']
              if entry['before'] is None:
                  assert not path.exists(), name
                  original = ''
              else:
                  original = path.read_text(encoding='utf8')
                  assert hashlib.sha256(original.encode()).hexdigest() == entry['before'], name
              previous = 0
              for start, end, text in entry['edits']:
                  assert type(start) is int and type(end) is int and isinstance(text, str)
                  assert previous <= start <= end <= len(original), name
                  previous = end
              result = original
              for start, end, text in reversed(entry['edits']):
                  result = result[:start] + text + result[end:]
              assert hashlib.sha256(result.encode()).hexdigest() == entry['after'], name
              updates.append((path, result))
          for path, result in updates:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(result, encoding='utf8')
          cleanup = ['.agents/rendering-migration.1', '.agents/rendering-migration.2', '.github/workflows/rendering-workspace.yml']
          for name in cleanup:
              path = root / name
              assert path.is_file() and not path.is_symlink()
              path.unlink()
          manifest['cleanup'] = cleanup
          pathlib.Path('/tmp/rendering-manifest.json').write_text(json.dumps(manifest))
          subprocess.run(['git', 'add', '--all', '--', *sorted(seen)], check=True)
          subprocess.run(['git', 'add', '--update', '--', *cleanup], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print(f'Verified {len(updates)} source files; removed temporary migration transport files.')
          PY
      - name: Create an unreferenced source commit without updating any branch
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const manifest = JSON.parse(fs.readFileSync('/tmp/rendering-manifest.json', 'utf8'));
            const { data: parent } = await github.rest.git.getCommit({ ...context.repo, commit_sha: context.sha });
            const entries = [];
            for (const file of manifest.files) {
              const content = fs.readFileSync(file.path);
              if (crypto.createHash('sha256').update(content).digest('hex') !== file.after) throw new Error(`Unexpected final content: ${file.path}`);
              const { data: blob } = await github.rest.git.createBlob({ ...context.repo, content: content.toString('base64'), encoding: 'base64' });
              entries.push({ path: file.path, mode: '100644', type: 'blob', sha: blob.sha });
            }
            for (const path of manifest.cleanup) entries.push({ path, mode: '100644', type: 'blob', sha: null });
            const { data: tree } = await github.rest.git.createTree({ ...context.repo, base_tree: parent.tree.sha, tree: entries });
            const { data: commit } = await github.rest.git.createCommit({
              ...context.repo, tree: tree.sha, parents: [context.sha],
              message: 'feat(ui): migrate all business pages to contract-bound Svelte rendering',
            });
            const result = { parent: context.sha, sha: commit.sha, tree: tree.sha, files: manifest.files.map(({ path, after }) => ({ path, sha256: after })), cleanup: manifest.cleanup };
            fs.writeFileSync('/tmp/rendering-result.json', JSON.stringify(result, null, 2));
            core.info(`Prepared source commit ${commit.sha}; no ref update, merge, release or deployment performed.`);
            await core.summary.addHeading('Verified migration commit').addRaw(`Commit: ${commit.sha}\nParent: ${context.sha}\nSource files: ${manifest.files.length}\nNo branch was updated by this workflow.`).write();
      - uses: actions/upload-artifact@v7
        with:
          name: verified-business-migration-commit
          path: /tmp/rendering-result.json
          retention-days: 3
          if-no-files-found: error
