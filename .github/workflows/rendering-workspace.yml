name: Rendering migration workspace
on:
  push:
    branches: [feat/typed-svelte-renderers]
    paths: [.github/workflows/rendering-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Export current tracked source for interrupted migration recovery
        run: |
          mkdir -p /tmp/rendering-recovery
          git rev-parse HEAD > /tmp/rendering-recovery/source-sha.txt
          git archive --format=tar HEAD > /tmp/rendering-recovery/source.tar
      - uses: actions/upload-artifact@v7
        with:
          name: rendering-recovery
          path: /tmp/rendering-recovery
          retention-days: 1
