name: Rendering migration workspace
on:
  push:
    branches: [feat/typed-svelte-renderers]
    paths: [.github/workflows/rendering-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Export locked dependencies and tools without credentials
        run: |
          mkdir -p /tmp/rendering-tools
          cp "$(command -v bun)" /tmp/rendering-tools/bun
          cp "$(command -v node)" /tmp/rendering-tools/node
          find . -type d -name node_modules -prune -print0 | tar --null -T - -czf /tmp/rendering-tools/dependencies.tar.gz
          du -h /tmp/rendering-tools/*
      - uses: actions/upload-artifact@v7
        with:
          name: rendering-tools
          path: /tmp/rendering-tools
          retention-days: 1
