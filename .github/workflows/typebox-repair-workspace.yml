name: TypeBox repair validation
# Temporary branch-only repair helper; removed before merge.
on:
  push:
    branches: [refactor/replace-zod-with-typebox]
permissions:
  contents: write
jobs:
  repair:
    if: >-
      github.event.head_commit.message == 'chore: apply reviewed TypeBox CI repairs'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Verify and apply exact reviewed patch
        run: |
          python3 <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          source = pathlib.Path('.github/typebox-ci-repairs.patch.b64')
          encoded = source.read_text().strip()
          encoded = encoded.replace('ffreO3fv', 'ffreO2fv').replace('J866bArsUKeipIKP866bArsUKeipIKPndv', 'J866bArsUKeipIKPndv')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '1119a87fcfce785bc2051828af73826668b034155c4b38c2c2e7a301153196e6', 'Patch checksum mismatch'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--whitespace=error', str(target)], check=True)
          subprocess.run(['git', 'apply', '--whitespace=error', str(target)], check=True)
          subprocess.run(['git', 'rm', '--', str(source)], check=True)
          PY
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Build required package and Panda runtime artifacts
        run: bun run build:packages
      - name: Verify focused runtime contracts
        run: |
          bun test packages/elysia/src packages/create-svadmin/src/generate-command.test.ts
          cd packages/ui
          bunx --no-install vitest run src/components/date-time-input.test.svelte.ts src/components/file-upload.test.svelte.ts src/components/field-display-registration.test.svelte.ts src/components/import-wizard.test.svelte.ts src/components/resource-workspace.test.svelte.ts src/components/numeric-input.test.svelte.ts src/components/combobox-field.test.svelte.ts
      - name: Commit only reviewed source repairs
        run: |
          git diff --exit-code -- bun.lock
          git diff --check
          git add -- packages/core/src/types.ts packages/create-svadmin/src/generate-command.ts packages/create-svadmin/src/generate-command.test.ts packages/lite/src/components/LiteFileUpload.svelte packages/lite/src/components/LiteFileUpload.test.svelte.ts packages/lite/src/components/LiteFilterBuilder.svelte packages/ui/src/components/DateRangeInput.svelte packages/ui/src/components/FileUpload.svelte packages/ui/src/components/TreeSelect.svelte packages/ui/src/components/combobox-field.test.svelte.ts packages/ui/src/components/date-time-input.test.svelte.ts packages/ui/src/components/field-display-registration.test.svelte.ts packages/ui/src/components/fieldComponentMap.ts packages/ui/src/components/file-upload.test.svelte.ts packages/ui/src/components/import-wizard.test-host.svelte packages/ui/src/components/import-wizard.test.svelte.ts packages/ui/src/components/resource-workspace.test-host.svelte packages/ui/src/components/resource-workspace.test.svelte.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(ui): repair typed field contracts and isolate regression test state'
          git push origin HEAD:refs/heads/refactor/replace-zod-with-typebox
      - name: Install Chromium for actual browser evidence
        run: bunx --no-install playwright install --with-deps chromium
      - name: Capture and assert field recovery states
        run: |
          mkdir -p .tmp-typebox-evidence docs/pr-evidence/typebox-ci
          cat > .tmp-typebox-evidence/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TypeBox CI repair verification</title></head><body><div id="app"></div><script type="module" src="/main.js"></script></body></html>
          HTML
          cat > .tmp-typebox-evidence/main.js <<'JS'
          import { mount } from 'svelte';
          import App from './App.svelte';
          import '../packages/ui/dist/app.css';
          mount(App, {target: document.getElementById('app')});
          JS
          cat > .tmp-typebox-evidence/App.svelte <<'SVELTE'
          <script lang="ts">
            import { createI18nScope, provideI18nScope } from '@svadmin/core/i18n';
            import DateRangeInput, { type DateRangeInputValue } from '../packages/ui/src/components/DateRangeInput.svelte';
            import FileUpload, { type UploadItem } from '../packages/ui/src/components/FileUpload.svelte';
            import FieldDisplay from '../packages/ui/src/components/FieldDisplay.svelte';
            import LiteFileUpload from '../packages/lite/src/components/LiteFileUpload.svelte';
            import LiteFilterBuilder from '../packages/lite/src/components/LiteFilterBuilder.svelte';
            provideI18nScope(createI18nScope({ locale: 'en' }));
            let range = $state<DateRangeInputValue | null>(null);
            let uploads = $state<UploadItem[]>([]);
            let error = $state<string | undefined>('File is too large.');
            let attempts = 0;
            async function upload(): Promise<void> {
              attempts += 1;
              if (attempts === 1) throw new Error('Synthetic retryable error');
            }
          </script>
          <main>
            <header><p>SVADMIN / REGRESSION VERIFICATION</p><h1>Typed fields and recovery states</h1><span>Real Svelte components · Native controls · Synthetic upload service</span></header>
            <section><h2>Nullable date range</h2><label for="start">Start date</label><label for="end">End date</label>
              <DateRangeInput bind:value={range} startId="start" endId="end" startName="start" endName="end" />
              <output data-testid="range">{JSON.stringify(range)}</output>
            </section>
            <section><h2>Upload retry without a URL receipt</h2><FileUpload accept=".txt" {upload} onChange={(items) => uploads = items} />
              <output data-testid="upload-receipt">{JSON.stringify(uploads.map(({ status, progress, error, url }) => ({ status, progress, error, url })))}</output>
            </section>
            <section><h2>Date and time display registrations</h2><div class="values"><div><small>TIME</small><FieldDisplay type="time" value="13:45" /></div><div><small>DATETIME</small><FieldDisplay type="datetime" value="2026-09-19T13:45:00Z" /></div></div></section>
            <section><h2>Native form recovery</h2><LiteFileUpload name="attachment" label="Attachment" {error} /><button type="button" onclick={() => error = undefined}>Clear server error</button></section>
            <section><h2>Server-owned filter form</h2><LiteFilterBuilder fields={[{ key: 'title', label: 'Title', type: 'text' }]} filters={[{ field: 'title', operator: 'contains', value: 'confirmed' }]} action="/filter" /></section>
          </main>
          <style>
            :global(body) { margin: 0; background: #f6f8fa; color: #233044; font: 14px/1.4 system-ui, sans-serif; }
            main { max-width: 1040px; margin: 20px auto; padding: 0 28px; }
            header { margin-bottom: 18px; } header p, small { letter-spacing: 0.08em; font-size: 11px; color: #5b687a; }
            h1 { font-size: 28px; margin: 4px 0 8px; font-weight: 650; } h2 { font-size: 16px; font-weight: 600; margin: 0 0 10px; }
            section { background: white; border: 1px solid #d9e0e8; border-radius: 9px; padding: 12px 18px; margin-top: 10px; }
            label { display: inline-block; width: 48%; font-size: 12px; margin-bottom: 6px; }
            output { display: block; margin-top: 8px; color: #536177; font: 12px/1.4 monospace; }
            .values { display: flex; gap: 60px; } .values div { display: grid; gap: 5px; }
            button { border: 1px solid #d9e0e8; border-radius: 5px; padding: 4px 10px; background: #fff; margin-top: 6px; }
          </style>
          SVELTE
          cat > .tmp-typebox-evidence/run.mjs <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs';
          import { createServer } from 'vite';
          import { svelte } from '@sveltejs/vite-plugin-svelte';
          import { chromium } from '@playwright/test';
          const root = process.cwd();
          const out = root + '/docs/pr-evidence/typebox-ci';
          const sourceSha = execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
          const server = await createServer({configFile:false,root:root+'/.tmp-typebox-evidence',plugins:[svelte()],resolve:{dedupe:['svelte'],conditions:['browser']},optimizeDeps:{exclude:['@svadmin/core','@svadmin/ui']},server:{host:'127.0.0.1',port:4183,strictPort:true,fs:{allow:[root]}}});
          await server.listen();
          const browser = await chromium.launch();
          const errors=[]; const checks=[];
          try {
            for(const [width,height] of [[1440,900],[1920,1080]]) {
              const page=await browser.newPage({viewport:{width,height},locale:'en-US',timezoneId:'UTC',reducedMotion:'reduce'});
              page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:4183',{waitUntil:'networkidle'});
              await page.getByRole('heading',{name:'Typed fields and recovery states'}).waitFor();
              await page.getByText('13:45',{exact:true}).waitFor();
              assert.equal(await page.getByTestId('range').textContent(),'null');
              await page.getByLabel('Start date').fill('2026-09-19');
              assert.deepEqual(JSON.parse(await page.getByTestId('range').textContent()),{start:'2026-09-19',end:null});
              await page.getByLabel('End date').fill('2026-09-30');
              await page.locator('.svadmin-file-upload input[type=file]').setInputFiles({name:'regression.txt',mimeType:'text/plain',buffer:Buffer.from('synthetic fixture')});
              await page.getByRole('alert').filter({hasText:'Synthetic retryable error'}).waitFor();
              await page.screenshot({path:`${out}/${width}x${height}-error.png`,animations:'disabled'});
              await page.getByRole('button',{name:'Retry upload'}).click();
              await page.waitForFunction(()=>document.querySelector('[data-testid="upload-receipt"]').textContent.includes('"success"'));
              assert.deepEqual(JSON.parse(await page.getByTestId('upload-receipt').textContent())[0],{status:'success',progress:100});
              await page.getByRole('button',{name:'Clear server error'}).click();
              assert.equal(await page.getByLabel('Attachment').getAttribute('aria-invalid'),null);
              const filters=await page.locator('#lite-filter-form').evaluate(form=>Object.fromEntries(new FormData(form)));
              assert.equal(filters['filters[0][value]'],'confirmed');
              await page.getByLabel('Start date').fill('');
              assert.deepEqual(JSON.parse(await page.getByTestId('range').textContent()),{start:null,end:'2026-09-30'});
              await page.screenshot({path:`${out}/${width}x${height}-recovered.png`,animations:'disabled'});
              checks.push({width,height,nullableRange:true,emptyUploadReceipt:true,retryRecovery:true,liteErrorClearing:true,nativeFilterData:true});
              await page.close();
            }
            assert.deepEqual(errors,[]);
            const images=Object.fromEntries(readdirSync(out).filter(name=>name.endsWith('.png')).map(name=>[name,createHash('sha256').update(readFileSync(out+'/'+name)).digest('hex')]));
            writeFileSync(out+'/results.json',JSON.stringify({sourceSha,runId:process.env.GITHUB_RUN_ID,checks,pageErrors:errors,images},null,2)+'\n');
            console.log(JSON.stringify(checks));
          } finally {await browser.close();await server.close();}
          JS
          node .tmp-typebox-evidence/run.mjs
      - name: Commit only verified browser evidence
        run: |
          git add -- docs/pr-evidence/typebox-ci
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(ui): record TypeBox CI repair browser evidence'
          git push origin HEAD:refs/heads/refactor/replace-zod-with-typebox
          rm -rf .tmp-typebox-evidence
      - name: Validate complete strict checking inventory
        run: bun run typecheck
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: typebox-ci-repair-browser
          path: |
            docs/pr-evidence/typebox-ci
            .tmp-typebox-evidence
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
