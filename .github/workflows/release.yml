name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      release_sha: ${{ steps.release-ref.outputs.sha }}
      release_manifest: ${{ steps.release-manifest.outputs.release_manifest }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Resolve open release pull request branch
        id: release-pr
        uses: actions/github-script@v9
        with:
          script: |
            const branch = 'release-please--branches--main';
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              head: `${context.repo.owner}:${branch}`,
              per_page: 100,
            });
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const unexpected = pulls.filter(
              (pull) =>
                pull.base.ref !== 'main' ||
                pull.head.ref !== branch ||
                pull.head.repo?.full_name !== repository,
            );
            if (unexpected.length > 0) {
              core.setFailed(`Release PR query returned ${unexpected.length} non-canonical result(s)`);
              return;
            }
            if (pulls.length > 1) {
              core.setFailed(`Expected at most one open release PR, found ${pulls.length}`);
              return;
            }
            if (pulls.length === 1) {
              core.setOutput('branch', branch);
              core.setOutput('number', String(pulls[0].number));
              core.info(`Found open release PR #${pulls[0].number}`);
            } else {
              core.info('No open release PR found');
            }

      - uses: actions/checkout@v7
        if: steps.release-pr.outputs.branch != ''
        with:
          ref: ${{ steps.release-pr.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        if: steps.release-pr.outputs.branch != '' || steps.release.outputs.releases_created == 'true'
        with:
          bun-version: "1.4.0"

      - name: Synchronize release peer ranges and lockfile
        if: steps.release-pr.outputs.branch != ''
        run: |
          git fetch origin main
          git checkout origin/main -- scripts/sync-release-pr.ts
          git checkout origin/main -- bun.lock
          bun scripts/sync-release-pr.ts --base-ref origin/main
          bun install --ignore-scripts

      - name: Commit synchronized release artifacts
        id: release-sync
        if: steps.release-pr.outputs.branch != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-please-manifest.json bun.lock packages/*/package.json packages/*/CHANGELOG.md packages/*/compatibility.json
          if git diff --quiet --cached HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit --no-verify -m "chore(release): synchronize workspace metadata"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push synchronized release artifacts
        if: steps.release-pr.outputs.branch != '' && steps.release-sync.outputs.changed == 'true'
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          AUTH_HEADER=$(node -e "process.stdout.write(Buffer.from('x-access-token:' + process.env.RELEASE_PAT).toString('base64'))")
          git -c core.hooksPath=/dev/null \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            push --no-verify "https://github.com/${REPOSITORY}.git" "HEAD:${RELEASE_BRANCH}"

      - name: Resolve immutable release SHA
        id: release-ref
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
          RELEASE_PATHS: ${{ steps.release.outputs.paths_released }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const outputs = JSON.parse(process.env.RELEASE_OUTPUTS || '{}');
          const paths = JSON.parse(process.env.RELEASE_PATHS || '[]');
          if (!Array.isArray(paths) || paths.length === 0) {
            throw new Error('release-please reported a release without paths');
          }

          const shas = paths.map((path) => outputs[`${path}--sha`]);
          if (shas.some((sha) => typeof sha !== 'string' || !/^[0-9a-f]{40,64}$/.test(sha))) {
            throw new Error(`Missing immutable release SHA for paths: ${paths.join(', ')}`);
          }

          const uniqueShas = [...new Set(shas)];
          if (uniqueShas.length !== 1) {
            throw new Error(`Release paths point at different SHAs: ${uniqueShas.join(', ')}`);
          }

          const releaseManifest = paths.map((path) => {
            const tag = outputs[`${path}--tag_name`];
            if (typeof tag !== 'string' || !/^[A-Za-z0-9._-]+$/.test(tag)) {
              throw new Error(`Missing or invalid release tag for ${path}: ${String(tag)}`);
            }
            return { path, tag };
          });

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${uniqueShas[0]}\n`);
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `release_manifest=${JSON.stringify(releaseManifest)}\n`,
          );
          NODE

      - uses: actions/checkout@v7
        if: steps.release.outputs.releases_created == 'true'
        with:
          ref: ${{ steps.release-ref.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Reconcile version-changed release packages
        id: release-manifest
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASE_SHA: ${{ steps.release-ref.outputs.sha }}
          RELEASE_MANIFEST: ${{ steps.release-ref.outputs.release_manifest }}
        run: |
          bun scripts/reconcile-release-manifest.ts > "$RUNNER_TEMP/reconciled-release.json"
          node <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/reconciled-release.json`, 'utf8'));
          if (!Array.isArray(result.releaseManifest) || result.releaseManifest.length === 0) {
            throw new Error('Reconciled release manifest is empty');
          }
          if (!Array.isArray(result.missingReleases)) {
            throw new Error('Reconciled missing release list is invalid');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_manifest=${JSON.stringify(result.releaseManifest)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `missing_releases=${JSON.stringify(result.missingReleases)}\n`);
          NODE

      - name: Create reconciled tags and GitHub releases
        if: steps.release.outputs.releases_created == 'true' && steps.release-manifest.outputs.missing_releases != '[]'
        uses: actions/github-script@v9
        env:
          RELEASE_SHA: ${{ steps.release-ref.outputs.sha }}
          MISSING_RELEASES: ${{ steps.release-manifest.outputs.missing_releases }}
        with:
          github-token: ${{ secrets.RELEASE_PAT }}
          script: |
            const fs = require('fs');
            const releaseSha = process.env.RELEASE_SHA;
            const releases = JSON.parse(process.env.MISSING_RELEASES || '[]');

            for (const release of releases) {
              const suffix = `-v${release.version}`;
              if (!release.tag.endsWith(suffix)) {
                core.setFailed(`Release tag ${release.tag} does not match version ${release.version}`);
                return;
              }

              try {
                const existingRef = await github.rest.git.getRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag}`,
                });
                if (existingRef.data.object.type !== 'commit' || existingRef.data.object.sha !== releaseSha) {
                  core.setFailed(
                    `Release tag ${release.tag} appeared at ${existingRef.data.object.sha}, expected ${releaseSha}`,
                  );
                  return;
                }
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/tags/${release.tag}`,
                  sha: releaseSha,
                });
              }

              try {
                await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: release.tag,
                });
                core.info(`GitHub release already exists for ${release.tag}`);
                continue;
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              const changelog = fs.readFileSync(`${release.path}/CHANGELOG.md`, 'utf8');
              const marker = `## [${release.version}](`;
              const start = changelog.indexOf(marker);
              const end = changelog.indexOf('\n## [', start + marker.length);
              if (start < 0) {
                core.setFailed(`Missing changelog entry for ${release.tag}`);
                return;
              }
              const body = changelog.slice(start, end < 0 ? undefined : end).trim();
              const component = release.tag.slice(0, -suffix.length);
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: release.tag,
                target_commitish: releaseSha,
                name: `${component}: v${release.version}`,
                body,
              });
              core.info(`Created reconciled GitHub release for ${release.tag}`);
            }

  trigger-publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true' && needs.release-please.outputs.release_sha != '' && needs.release-please.outputs.release_manifest != ''
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CI publish via workflow_dispatch
        uses: actions/github-script@v9
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
          RELEASE_MANIFEST: ${{ needs.release-please.outputs.release_manifest }}
        with:
          script: |
            const releaseSha = process.env.RELEASE_SHA;
            const releaseManifest = process.env.RELEASE_MANIFEST;

            if (!/^[0-9a-f]{40,64}$/.test(releaseSha)) {
              core.setFailed(`Invalid immutable release SHA: ${releaseSha}`);
              return;
            }

            const releases = JSON.parse(releaseManifest);
            if (!Array.isArray(releases) || releases.length === 0) {
              core.setFailed('release-please returned no release manifest');
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref: 'main',
              inputs: {
                release_sha: releaseSha,
                release_manifest: releaseManifest,
                publish: 'true',
              },
            });
            console.log(`✅ Triggered ci.yml publish for ${releaseSha}`);
