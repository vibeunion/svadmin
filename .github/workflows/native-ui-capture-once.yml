name: Record native UI browser evidence
on:
  push:
    branches: [feat/ui-panda-complete-20260919]
    paths: ['.github/workflows/native-ui-capture-once.yml']
permissions:
  contents: read
jobs:
  capture:
    if: github.repository == 'vibeunion/svadmin' && github.ref == 'refs/heads/feat/ui-panda-complete-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Discard old captures before any verification
        run: rm -rf docs/pr-evidence/panda-styles
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun test packages/core/src/i18n-source-regression.test.ts
      - run: bun run build:packages
      - name: Capture actual components against immutable baseline
        run: |
          bunx --no-install playwright install --with-deps chromium
          node scripts/check-panda-browser.mjs || { node scripts/diagnose-ui-screenshots.mjs; exit 1; }
          git diff --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-ui-diagnostic-captures
          path: docs/pr-evidence/panda-styles/
          if-no-files-found: ignore
      - name: Record passing captures and remove this one-time writer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/feat/ui-panda-complete-20260919
          test -s docs/pr-evidence/panda-styles/provenance.json
          git add docs/pr-evidence/panda-styles
          git rm .github/workflows/native-ui-capture-once.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c core.hooksPath=/dev/null commit -m 'test(styles): record native UI captures and retire evidence writer'
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/feat/ui-panda-complete-20260919
