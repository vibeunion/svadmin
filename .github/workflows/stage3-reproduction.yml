name: Stage3 isolated reproduction
on:
  push:
    branches: [fix/panda-stage3-validation-20260919]
    paths: [.github/workflows/stage3-reproduction.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ee01ea0b52285bd3129447cd0b2ddb0c114f45ce
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.9.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Install exact baseline dependencies
        env:
          HUSKY: '0'
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          git diff --exit-code -- bun.lock
      - name: Archive only public dependencies and tools
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/stage3-reproduction"
          mkdir -p "$out/tools"
          cp "$(command -v node)" "$out/tools/node"
          cp "$(command -v bun)" "$out/tools/bun"
          printf '%s\n' 'ee01ea0b52285bd3129447cd0b2ddb0c114f45ce' > "$out/base.txt"
          node --version > "$out/node-version.txt"
          bun --revision > "$out/bun-version.txt"
          sha256sum bun.lock package.json > "$out/manifests.sha256"
          find . -type d -name node_modules -prune -print0 | tar --null -T - -czf "$out/dependencies.tar.gz"
          tar -czf "$out/tools.tar.gz" -C "$out/tools" node bun
          rm -rf "$out/tools"
          (cd "$out" && sha256sum dependencies.tar.gz tools.tar.gz > archives.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-reproduction-ee01ea0
          path: ${{ runner.temp }}/stage3-reproduction/
          retention-days: 2
          if-no-files-found: error
