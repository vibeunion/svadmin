name: Surface Contracts
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/surface/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.github/workflows/surface-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: surface-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: Contract tests (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify complete PR diff whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git diff --check HEAD^
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Prepare shared design contracts from their real source
        run: |
          bun run --cwd packages/ui build
      - name: Test DOM-free Surface contracts
        working-directory: packages/surface
        run: bun x vitest run --config vitest.contracts.config.ts
      - run: git diff --exit-code -- bun.lock
  integration:
    name: Svelte integration and CSS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run build:packages
      - name: Surface component and protocol tests
        run: bun run --cwd packages/surface test
      - name: Surface strict typecheck
        run: bun run --cwd packages/surface check
      - name: Regenerated styles match committed files
        run: |
          bun run --cwd packages/surface styles:check
          git diff --exit-code -- bun.lock packages/surface/src/styles
      - name: Install Chromium
        run: bun run playwright install --with-deps chromium
      - name: Built-package browser acceptance without CSS compiler plugins
        run: node packages/surface/scripts/browser-evidence.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surface-browser-evidence
          path: test-results/surface-evidence/
          if-no-files-found: warn
