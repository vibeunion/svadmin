name: Prepare enterprise array ownership candidate

# Temporary evidence-only helper. Never moves feature or main refs.
on:
  push:
    branches: [review/enterprise-reconcile-20260920]
permissions:
  contents: read
jobs:
  retain:
    if: >-
      github.event.head_commit.message == 'review: retain final enterprise candidate evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify exact final checkout, all 187 unit tests, ten browser passes and original PNGs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: 51b54446612869c334888b46eec53ec0873b7e68
          EVIDENCE_RUN_ID: '35477652253'
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags --depth=1 origin "$SOURCE_HEAD"
          python3 review-assets/retain-evidence.py
