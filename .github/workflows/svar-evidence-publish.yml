# 本次 PR 的一次性证据归档。只复制固定成功运行中的两张已校验 PNG，不运行产物代码。
# 图片归档后删除此工作流；长期验证流程仍保持 contents: read。
name: Archive verified SVAR screenshots
on:
  push:
    branches: ['feat/svar-grid-adapter']
    paths: ['.github/workflows/svar-evidence-publish.yml']
permissions: {}
jobs:
  archive:
    if: github.repository == 'vibeunion/svadmin'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          repository: vibeunion/svadmin
          run-id: 35413011684
          name: svar-grid-verification
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: verified-svar-evidence
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const owner = 'vibeunion', repo = 'svadmin';
            const branch = 'feat/svar-grid-adapter';
            const source = 'c75394f1216531c1185a344b183d13f57ed5c542';
            const run = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: 35413011684 })).data;
            if (run.head_sha !== source || run.conclusion !== 'success') throw new Error('Unexpected evidence source');
            const parent = (await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` })).data.object.sha;
            if (parent !== context.sha) throw new Error('Branch advanced; do not overwrite concurrent work');
            const files = [
              { input: 'results/grid-light-dark-state-evidence-at-1440/light-restore-1440.png', path: 'docs/evaluations/assets/svar-grid-1440x900.png', width: 1440, height: 900, sha256: 'b2f41800be45bf9401c88a85735827aaf01e0825a724706fdfd6388e4be5b435' },
              { input: 'results/grid-light-dark-state-evidence-at-1920/dark-restore-1920.png', path: 'docs/evaluations/assets/svar-grid-1920x1080.png', width: 1920, height: 1080, sha256: 'e3f9cbffe9c9374339737063d619067498872b9c30164d346248af6bf023fdc1' },
            ];
            const tree = [];
            for (const file of files) {
              const data = fs.readFileSync(`verified-svar-evidence/${file.input}`);
              if (crypto.createHash('sha256').update(data).digest('hex') !== file.sha256 ||
                  data.subarray(0, 8).toString('hex') !== '89504e470d0a1a0a' ||
                  data.readUInt32BE(16) !== file.width || data.readUInt32BE(20) !== file.height) {
                throw new Error('Evidence hash/dimensions mismatch');
              }
              const blob = await github.rest.git.createBlob({ owner, repo, content: data.toString('base64'), encoding: 'base64' });
              tree.push({ path: file.path, mode: '100644', type: 'blob', sha: blob.data.sha });
            }
            tree.push({ path: 'docs/evaluations/assets/svar-evidence.json', mode: '100644', type: 'blob', content: JSON.stringify({ sourceCommit: source, runId: 35413011684, artifactId: 10574771156, files }, null, 2) + '\n' });
            const commit = (await github.rest.git.getCommit({ owner, repo, commit_sha: parent })).data;
            const newTree = await github.rest.git.createTree({ owner, repo, base_tree: commit.tree.sha, tree });
            const next = await github.rest.git.createCommit({ owner, repo, message: 'docs(ui): archive original verified SVAR viewport screenshots', tree: newTree.data.sha, parents: [parent] });
            await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: next.data.sha, force: false });
            core.info(`Archived original screenshots in ${next.data.sha}`);
