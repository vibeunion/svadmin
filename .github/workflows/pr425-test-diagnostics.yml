name: PR 425 compatibility repair

on:
  push:
    branches: [codex/permission-catalog-adapter]
    paths: [.github/workflows/pr425-test-diagnostics.yml]

permissions:
  contents: read

jobs:
  repair:
    if: github.repository == 'vibeunion/svadmin' && github.ref == 'refs/heads/codex/permission-catalog-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Apply exact compatibility repairs and regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(text, old, new):
              if text.count(old) != 1:
                  raise SystemExit('Source changed; refusing speculative replacement: ' + old[:80])
              return text.replace(old, new, 1)
          locale = Path('packages/core/src/i18n-source-regression.test.ts')
          text = replace_once(locale.read_text(), "import { expect, test } from 'vitest';", "import { expect, test } from 'bun:test';")
          text = replace_once(text, "    expect(locales.has(localeName), `Duplicate locale: ${localeName}`).toBe(false);", "    if (locales.has(localeName)) throw new Error(`Duplicate locale: ${localeName}`);")
          text = replace_once(text, "      expect(keys.has(key), `Duplicate translation: ${localeName}.${key}`).toBe(false);", "      if (keys.has(key)) throw new Error(`Duplicate translation: ${localeName}.${key}`);")
          css = Path('packages/lite/src/lite.css')
          styles = replace_once(css.read_text(), "  z-index: 1;\n  inset: 0;", "  z-index: 1;\n  top: 0;\n  right: 0;\n  bottom: 0;\n  left: 0;")
          styles = replace_once(styles, ".lite-file-picker__visual {\n  display: flex;\n  align-items: center;\n  gap: 10px;", ".lite-file-picker__visual {\n  display: flex;\n  align-items: center;")
          styles = replace_once(styles, ".lite-file-picker__button {", ".lite-file-picker__visual > * + * {\n  margin-left: 10px;\n}\n\n.lite-file-picker__button {")
          styles = replace_once(styles, ".lite-file-picker__native:focus-visible + .lite-file-picker__visual {", ".lite-file-picker__native:focus + .lite-file-picker__visual {")
          regression = Path('packages/lite/src/file-picker-css.test.ts')
          if regression.exists():
              raise SystemExit('Regression already exists; refusing to overwrite')
          locale.write_text(text)
          css.write_text(styles)
          regression.write_text(r'''import { expect, test } from 'bun:test';
          import { readFileSync } from 'node:fs';
          import { resolve } from 'node:path';

          for (const file of ['lite.css', '../dist/lite.css']) {
            test(`${file}: file picker retains focus feedback, spacing and native overlay bounds`, () => {
              const css = readFileSync(resolve(import.meta.dir, file), 'utf8')
                .replace(/\/\*[\s\S]*?\*\//gu, '');
              expect(css).toMatch(/\.lite-file-picker__native:focus\s*\+\s*\.lite-file-picker__visual\s*\{[^}]*box-shadow\s*:/u);
              expect(css).toMatch(/\.lite-file-picker__visual\s*>\s*\*\s*\+\s*\*\s*\{[^}]*margin-left\s*:\s*10px/u);
              const overlay = css.match(/\.lite-file-picker__native\s*\{([^}]*)\}/u)?.[1];
              expect(overlay).toBeDefined();
              for (const edge of ['top', 'right', 'bottom', 'left']) {
                expect(overlay).toMatch(new RegExp(`\\b${edge}\\s*:\\s*0\\s*;`, 'u'));
              }
              expect(overlay).toMatch(/\bopacity\s*:\s*0\s*;/u);
              expect(css).not.toMatch(/:focus-visible\b|\bgap\s*:|\binset\s*:/u);
            });
          }
          ''')
          PY
          git diff --check
      - name: Install existing dependency graph
        run: bun install --frozen-lockfile
      - name: Build workspace and validate compatibility regressions
        run: |
          bun run build:packages
          bun test scripts/check-type-coverage.test.ts packages/core/src/i18n-source-regression.test.ts packages/lite/src/ie11-ssr-contract.test.ts packages/lite/src/file-picker-css.test.ts
          bun scripts/check-type-coverage.ts
      - name: Commit only validated source and test repairs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch origin codex/permission-catalog-adapter
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/core/src/i18n-source-regression.test.ts packages/lite/src/lite.css packages/lite/src/file-picker-css.test.ts
          git commit -m 'fix(lite): preserve compatible file picker styles and align locale test runtime'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/codex/permission-catalog-adapter
