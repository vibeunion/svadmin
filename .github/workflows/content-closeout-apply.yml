          ])
          Path('.github/workflows/content-closeout-apply.yml').unlink()
          PY
          git diff --check
          git config user.name 'svadmin automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/core/src/types.ts packages/lite/src/components/LiteFilterBuilder.svelte packages/ui/src/components .github/workflows/content-closeout-apply.yml
          git commit -m 'fix(ui): close strict optional, field and scoped-locale integration gaps'
          git push origin "HEAD:refs/heads/$branch"
