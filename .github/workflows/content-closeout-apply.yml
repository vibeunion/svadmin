name: Apply guarded content integration fixes
on:
  push:
    branches: [fix/panda-stage3-validation-20260919]
    paths: [.github/workflows/content-closeout-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply exact reviewed replacements, never force-push
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=fix/panda-stage3-validation-20260919
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = b281ef0b5d41f8bd0b8c0df04784f8cbb9034de1
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          def edit(path, sha, replacements):
              assert subprocess.check_output(['git', 'hash-object', path], text=True).strip() == sha, path
              file = Path(path)
              text = file.read_text()
              for old, new in replacements:
                  assert text.count(old) == 1, (path, old, text.count(old))
                  text = text.replace(old, new)
              file.write_text(text)
          edit('packages/lite/src/components/LiteFilterBuilder.svelte', '2e3236b7e7d5a6a2259524343428397f4f80631d', [('    disabled = false,\n    onApply,', '    disabled = false,')])
          edit('packages/core/src/types.ts', 'ff7df3c9a275b048f010db8f601a613fd6f3e8cb', [("| 'url' | 'email' | 'phone' | 'currency' | 'file'", "| 'url' | 'email' | 'phone' | 'currency' | 'percent' | 'file'")])
          edit('packages/ui/src/components/TreeSelect.svelte', '39db017e42b6777840bce55488d89986e9019444', [('node.dataset.treeValue', "node.dataset['treeValue']")])
          edit('packages/ui/src/components/DateRangeInput.svelte', 'b09e5a84143b22dc53a65b483a4acd8bbdeaddd2', [
              ("  import DateTimeInput,", "  import { definedOptions } from '@svadmin/core/options';\n  import DateTimeInput,"),
              ("    const result = { ...value, [part]: next };", "    const result: DateRangeInputValue = { start: value?.start ?? null, end: value?.end ?? null, [part]: next };"),
              ("    value={value?.start}\n    {mode}\n    {min}\n    {max}\n    {step}\n    id={startId}\n    name={startName}", "    value={value?.start ?? null}\n    {mode}\n    {...definedOptions({ min, max, step, id: startId, name: startName, describedby })}"),
              ("    describedby={describedby}\n    onchange={(next) => update('start', next)}", "    onchange={(next) => update('start', next)}"),
              ("    value={value?.end}\n    {mode}\n    {min}\n    {max}\n    {step}\n    id={endId}\n    name={endName}", "    value={value?.end ?? null}\n    {mode}\n    {...definedOptions({ min, max, step, id: endId, name: endName, describedby })}"),
              ("    describedby={describedby}\n    onchange={(next) => update('end', next)}", "    onchange={(next) => update('end', next)}"),
          ])
          edit('packages/ui/src/components/FileUpload.svelte', '228f08f27d9cc4ccf5e0251a3ae544f6c5e67450', [
              ('Promise<{ url?: string } | void>', 'Promise<{ url?: string } | undefined> | Promise<void>'),
              ("  function updateItem(id: string, update: Partial<UploadItem>): void {\n    items = items.map(item => item.id === id ? { ...item, ...update } : item);", "  function updateItem(id: string, update: Partial<UploadItem>, clear: ('error' | 'url')[] = []): void {\n    items = items.map(item => {\n      if (item.id !== id) return item;\n      const next = { ...item, ...update };\n      for (const key of clear) delete next[key];\n      return next;\n    });"),
              ("updateItem(item.id, { status: 'uploading', progress: 0, error: undefined });", "updateItem(item.id, { status: 'uploading', progress: 0 }, ['error']);"),
