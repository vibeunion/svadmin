              ("void process({ ...item, status: 'queued', error: undefined });", "void process(item);"),
          ])
          edit('packages/ui/src/components/combobox-field.test.svelte.ts', '940bf88ede2d40bf54dc100e985b6f9578cbeccd', [("getMany: vi.fn(async ({ ids })", "getMany: vi.fn<NonNullable<DataProvider['getMany']>>(async ({ ids })")])
          edit('packages/ui/src/components/import-wizard.test.svelte.ts', 'bfa55c69d575e79b8e555b14d950df90f0b54814', [
              ("import { setLocale } from '@svadmin/core/i18n';\n", ''),
