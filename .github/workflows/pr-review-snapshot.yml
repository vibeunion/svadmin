name: PR review snapshot
on:
  push:
    branches: [review/pr-integration-20260919-1454]
    paths: [.github/workflows/pr-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture refreshed repaired refs without credentials or repository writes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr-review"
          git fetch --no-tags origin refs/heads/main:refs/review/main
          for pr in 434 436 437 438 441; do
            git fetch --no-tags origin "refs/pull/$pr/head:refs/review/pr-$pr"
          done
          git for-each-ref --format='%(refname) %(objectname)' refs/review/ > "$RUNNER_TEMP/pr-review/refs.txt"
          git bundle create "$RUNNER_TEMP/pr-review/svadmin-review.bundle" --glob='refs/review/*'
          git bundle verify "$RUNNER_TEMP/pr-review/svadmin-review.bundle"
          sha256sum "$RUNNER_TEMP/pr-review/svadmin-review.bundle" > "$RUNNER_TEMP/pr-review/SHA256SUMS"
      - uses: actions/upload-artifact@v6
        with:
          name: svadmin-pr-review-source
          path: ${{ runner.temp }}/pr-review/
          retention-days: 2
