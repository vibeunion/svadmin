name: Guarded enterprise reconciliation

# Temporary review-branch helper; never part of main or the feature candidate.
on:
  push:
    branches: [review/enterprise-reconcile-20260920]
permissions:
  contents: read
jobs:
  prepare:
    if: >-
      github.event.head_commit.message == 'review: execute guarded enterprise follow-up'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare source-only follow-up Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp review-assets/followup.py "$RUNNER_TEMP/enterprise-followup.py"
          git fetch --quiet --no-tags --depth=1 origin 034eb737b1ad4caca02fcd42c5f83559aaedb592
          git switch --detach 034eb737b1ad4caca02fcd42c5f83559aaedb592
          python3 "$RUNNER_TEMP/enterprise-followup.py"
          test -z "$(git diff --name-only -- .github/workflows)"
          git diff --check
