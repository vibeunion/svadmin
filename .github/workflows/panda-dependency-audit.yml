name: Panda dependency audit

on:
  push:
    branches: [feat/panda-tokens-no-tailwind]
  pull_request:
    paths: ['package.json', 'bun.lock', '.github/workflows/panda-dependency-audit.yml']

permissions:
  contents: read

concurrency:
  group: panda-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Record exact lockfile and installed tree
        run: |
          mkdir -p "$RUNNER_TEMP/panda-audit"
          git rev-parse HEAD > "$RUNNER_TEMP/panda-audit/commit.txt"
          cp bun.lock package.json "$RUNNER_TEMP/panda-audit/"
          bun --revision > "$RUNNER_TEMP/panda-audit/bun.txt"
          bun install --frozen-lockfile
          bun pm ls --all > "$RUNNER_TEMP/panda-audit/installed.txt"
      - name: Audit without suppressing severities
        run: |
          set +e
          bun audit --json > "$RUNNER_TEMP/panda-audit/audit.json" 2>&1
          status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/panda-audit/exit-code.txt"
          cat "$RUNNER_TEMP/panda-audit/audit.json"
          exit "$status"
      - name: Preserve the unfiltered report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: panda-dependency-audit
          path: ${{ runner.temp }}/panda-audit/
          retention-days: 14
          if-no-files-found: error
