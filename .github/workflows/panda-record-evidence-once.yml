name: Record verified Panda evidence once

on:
  push:
    branches: [feat/panda-tokens-no-tailwind]
    paths: ['scripts/panda-record-evidence-once.py']

permissions:
  contents: write
  actions: read

concurrency:
  group: panda-reviewed-evidence-write
  cancel-in-progress: false

jobs:
  record:
    if: github.ref == 'refs/heads/feat/panda-tokens-no-tailwind'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Record provenance-checked screenshots and native-CSS documentation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin refs/heads/feat/panda-tokens-no-tailwind | cut -f1)" = "$GITHUB_SHA"
          python3 scripts/panda-record-evidence-once.py
      - name: Check the native integration contract
        run: |
          bun install --frozen-lockfile
          bunx --no-install prettier --write --single-quote scripts/tailwind-source-contract.test.ts
          bunx --no-install eslint scripts/tailwind-source-contract.test.ts --fix
          bun test scripts/tailwind-source-contract.test.ts
      - name: Commit only documentation, contract tests and verified evidence
        run: |
          git add README.md scripts/tailwind-source-contract.test.ts docs/pr-evidence/panda-styles
          git rm scripts/panda-record-evidence-once.py
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs(styles): record verified visual evidence and native CSS integration'
          git push origin HEAD:refs/heads/feat/panda-tokens-no-tailwind
