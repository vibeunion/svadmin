name: Temporary reviewed build repair

on:
  push:
    branches: [codex/permission-catalog-adapter, release-please--branches--main]
    paths: [.github/workflows/pr-review-build-repair.yml]

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'vibeunion/svadmin' && (github.ref == 'refs/heads/codex/permission-catalog-adapter' || github.ref == 'refs/heads/release-please--branches--main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Apply narrowly guarded build fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          import subprocess

          root = Path('packages/core/src')
          locale = root / 'i18n.svelte.ts'
          before = locale.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(before)).encode() + b'\0' + before).hexdigest()
          assert blob == '1264f7e811e0812178177ca0a37f4e26378d1d28', 'Locale source changed; review before retrying'
          text = before.decode('utf-8')
          for line in ["    'common.processing': '处理中...',\n", "    'common.processing': 'Processing...',\n"]:
              assert text.count(line) == 2, 'Unexpected translation duplicates'
              text = text.replace(line, '', 1)
          locale.write_text(text)
          names = ['create', 'update', 'delete', 'create-many', 'update-many', 'delete-many']
          for name in names:
              path = root / (name + '-hooks.svelte.ts')
              text = path.read_text()
              assert len(re.findall(r'^interface Callbacks<S extends ContractSchemas> \{', text, re.M)) == 1, str(path)
              assert not re.search(r'^export interface Callbacks\b', text, re.M), str(path)
              path.write_text(text.replace('interface Callbacks<S extends ContractSchemas> {', 'export interface Callbacks<S extends ContractSchemas> {', 1))
          expected = {str(locale)} | {str(root / (name + '-hooks.svelte.ts')) for name in names}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == expected, 'Unexpected changed files'
          PY
          git diff --check
          git diff --stat
          git diff -- packages/core/src/i18n.svelte.ts '*-hooks.svelte.ts'
      - name: Commit only to this reviewed PR branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            codex/permission-catalog-adapter|release-please--branches--main) ;;
            *) exit 1 ;;
          esac
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- packages/core/src/i18n.svelte.ts packages/core/src/create-hooks.svelte.ts packages/core/src/update-hooks.svelte.ts packages/core/src/delete-hooks.svelte.ts packages/core/src/create-many-hooks.svelte.ts packages/core/src/update-many-hooks.svelte.ts packages/core/src/delete-many-hooks.svelte.ts
          git commit -m 'fix(core): remove duplicate translations and expose declaration callback types'
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth_header" push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
