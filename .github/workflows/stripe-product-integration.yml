name: Guarded Stripe product integration
on:
  push:
    branches: [feat/stripe-first-design-kit-20260919]
    paths: [.github/workflows/stripe-product-integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply locally verified changes without overwriting concurrent work
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=feat/stripe-first-design-kit-20260919
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = 0f6c4ad148f69b501870f0c18c6ea94bd27a8349
          git config user.name 'svadmin automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git merge --no-commit --no-ff 8f068fb093b48cd2410b3b28a6066b567a44690e; then
            test "$(git diff --name-only --diff-filter=U)" = packages/ui/panda.config.ts
          fi
          cat > packages/ui/panda.config.ts <<'TS'
          import { defineConfig } from '@pandacss/dev';
          import { designTokens, semanticTokens } from './design/tokens.js';
          import { surfaceMetric, surfaceTable } from './design/recipes.js';
          import { uiButton, uiBadge, uiInput, uiTextarea } from './design/primitive-recipes.js';
          import { productSection, productToolbar, productWorkspace, productSettings, productSettingsRow, productList } from './design/product-recipes.js';
          import { contentTokens, contentSemanticTokens } from './design/content-tokens.js';
          import { contentPage, contentHeader, metricBlock } from './design/content-recipes.js';

          export default defineConfig({
            preflight: false,
            presets: [],
            prefix: 'svadmin',
            // 主题变量必须在嵌套主题根重新绑定，不能继承已经解析的根节点颜色。
            cssVarRoot: ':where(:root, :host, .svadmin-theme, .dark, [data-theme])',
            include: ['./src/**/*.{ts,svelte}'],
            exclude: ['./src/**/*.test.*', './src/styled-system/**'],
            outdir: 'src/styled-system',
            outExtension: 'js',
            theme: {
              tokens: designTokens,
              semanticTokens,
              recipes: { uiButton, uiBadge, uiTextarea },
              slotRecipes: { surfaceMetric, surfaceTable, uiInput, productSection, productToolbar, productWorkspace, productSettings, productSettingsRow, productList },
              extend: {
                tokens: contentTokens,
                semanticTokens: contentSemanticTokens,
                slotRecipes: { contentPage, contentHeader, metricBlock },
              },
            },
            // AI 与普通调用方在运行时选择变体；不能依赖扫描碰巧发现这些值。
            staticCss: { recipes: {
              surfaceMetric: ['*'], surfaceTable: ['*'],
              uiButton: ['*'], uiBadge: ['*'], uiInput: ['*'], uiTextarea: ['*'],
              contentPage: ['*'], contentHeader: ['*'], metricBlock: ['*'],
              productSection: ['*'], productToolbar: ['*'], productWorkspace: ['*'], productSettings: ['*'], productSettingsRow: ['*'], productList: ['*'],
            } },
          });
          TS
          git add packages/ui/panda.config.ts
          git rm .github/workflows/stripe-product-integration.yml
          test -z "$(git diff --name-only --diff-filter=U)"
          test "$(git write-tree)" = 918c8b2f234abf8a6ef1c101ea03af8a9ccc6cd7
          python3 <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          payload = ''''''
          patch = gzip.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'c27b4fe38ab464df1fdda011f71e5b285f8087293ae33614d28c283d622f26b5'
          Path('/tmp/stripe-product.patch').write_bytes(patch)
          PY
          git apply --check /tmp/stripe-product.patch
          git apply --index /tmp/stripe-product.patch
          git diff --cached --check
          test "$(git write-tree)" = 3f2e325dd9ce30f4b34fa79cb6b7235ddadf1aa6
          git commit -m 'feat(design): integrate Stripe-first patterns and readable status badges with current main'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD HEAD^{tree}
