name: Native UI integration diagnostics
on:
  push:
    branches: [feat/ui-panda-complete-20260919]
    paths: ['.github/workflows/native-ui-final-diagnostics.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'vibeunion/svadmin' && github.ref == 'refs/heads/feat/ui-panda-complete-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          show-progress: false
      - name: Inspect a local-only merge, never update branch refs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rev-parse HEAD origin/main
          git merge-base HEAD origin/main
          git -c core.hooksPath=/dev/null merge --no-commit --no-ff origin/main || test -n "$(git ls-files -u)"
          git status --short
          echo '=== CONFLICT CONTENT ==='
          python3 - <<'PY'
          import subprocess, pathlib
          names = subprocess.check_output(['git','diff','--name-only','--diff-filter=U','-z']).decode().split('\0')
          for name in filter(None,names):
              print('FILE',name)
              print(subprocess.check_output(['git','ls-files','-u','--',name]).decode())
              path = pathlib.Path(name)
              if path.exists() and path.suffix not in ('.png','.jpg') and name != 'bun.lock':
                  text = path.read_text()
                  if len(text) <= 18000: print(text)
                  else:
                      lines = text.splitlines()
                      indices = {j for i,line in enumerate(lines) if line.startswith(('<<<<<<<','=======','>>>>>>>')) for j in range(max(0,i-8),min(len(lines),i+12))}
                      for i in sorted(indices): print(f'{i+1}: {lines[i]}')
          PY
          echo '=== CURRENT FORM FILES ==='
          git ls-files '*form*' '*Form*' | head -60
          echo '=== MAIN OVERRIDES ==='
          git show origin/main:package.json | sed -n '85,125p'
          echo '=== MERGE STAT ==='
          git diff --cached --stat HEAD
