name: UI migration workspace
on:
  push:
    branches: [feat/ui-panda-complete-20260919]
    paths: ['.github/workflows/ui-migration-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Capture locked offline verification dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/ui-migration-workspace"
          tar -czf "$RUNNER_TEMP/ui-migration-workspace/node_modules.tar.gz" node_modules
          cp "$(command -v bun)" "$RUNNER_TEMP/ui-migration-workspace/bun"
          git archive --format=tar.gz -o "$RUNNER_TEMP/ui-migration-workspace/source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/ui-migration-workspace/commit.txt"
          sha256sum "$RUNNER_TEMP/ui-migration-workspace/"* > "$RUNNER_TEMP/ui-migration-workspace/SHA256SUMS"
      - uses: actions/upload-artifact@v7
        with:
          name: ui-migration-workspace
          path: ${{ runner.temp }}/ui-migration-workspace/
          retention-days: 1
