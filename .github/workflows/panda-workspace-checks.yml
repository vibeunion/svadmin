name: Panda workspace checks

on:
  push:
    branches: [feat/panda-tokens-no-tailwind]
  pull_request:
    paths:
      - 'packages/ui/**'
      - 'packages/surface/**'
      - 'packages/ai-elements/**'
      - 'packages/create-svadmin/**'
      - 'example/**'
      - 'scripts/check-package-packs.ts'
      - 'scripts/run-tests.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/panda-workspace-checks.yml'

permissions:
  contents: read

concurrency:
  group: panda-workspace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Workspace ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [tests, types, packs]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Record immutable source and environment
        env:
          CHECK_NAME: ${{ matrix.check }}
        run: |
          mkdir -p "$RUNNER_TEMP/panda-workspace"
          git rev-parse HEAD > "$RUNNER_TEMP/panda-workspace/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/panda-workspace/tree.txt"
          git show HEAD:package.json > "$RUNNER_TEMP/panda-workspace/package.json"
          node --version > "$RUNNER_TEMP/panda-workspace/node.txt"
          bun --revision > "$RUNNER_TEMP/panda-workspace/bun.txt"
          printf '%s\n' "$CHECK_NAME" > "$RUNNER_TEMP/panda-workspace/check.txt"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/panda-workspace/install.log"
      - name: Build workspace packages
        run: bun run build:packages 2>&1 | tee "$RUNNER_TEMP/panda-workspace/build.log"
      - name: Verify workspace or package consumer
        env:
          CHECK_NAME: ${{ matrix.check }}
        run: |
          case "$CHECK_NAME" in
            tests) command=(bun run test) ;;
            types) command=(bun run typecheck) ;;
            packs) command=(bun run pack:check) ;;
            *) exit 2 ;;
          esac
          printf '%q ' "${command[@]}" > "$RUNNER_TEMP/panda-workspace/command.txt"
          printf '\n' >> "$RUNNER_TEMP/panda-workspace/command.txt"
          set +e
          "${command[@]}" 2>&1 | tee "$RUNNER_TEMP/panda-workspace/check.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/panda-workspace/exit-code.txt"
          exit "$status"
      - name: Preserve exact logs even when verification fails
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: panda-workspace-${{ matrix.check }}
          path: ${{ runner.temp }}/panda-workspace/
          retention-days: 14
          if-no-files-found: error
