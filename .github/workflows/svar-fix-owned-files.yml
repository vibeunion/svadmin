name: SVAR owned type refinements
on:
  pull_request:
    paths: ['.github/workflows/svar-fix-owned-files.yml']
permissions:
  contents: write
jobs:
  refine:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/svar-grid-adapter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.payload.pull_request.head.ref;
            const expected = context.payload.pull_request.head.sha;
            const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            if (ref.data.object.sha !== expected) { core.info('Head moved; no write performed'); return; }
            const edits = [
              ['packages/ui/src/components/svar-grid-interactions.ts', [
                ["extends SvarGridEngineProps {", "extends Omit<SvarGridEngineProps, 'init' | 'columns'> {"],
              ]],
              ['packages/ui/src/components/SvarResourceTableView.svelte', [
                ["import { snapshotPlainData } from '@svadmin/core/schema';", "import { snapshotPlainData, decodeBaseRecord } from '@svadmin/core/schema';"],
                ["const input = variables === undefined ? undefined : snapshotPlainData(variables);", "const input = variables === undefined ? undefined : decodeBaseRecord(snapshotPlainData(variables));"],
              ]],
              ['packages/ui/src/components/svar-grid-features.test.ts', [
                ["assert.equal('template' in checkedSvarInteractiveColumns([raw])[0]!, false);", "const [checked] = checkedSvarInteractiveColumns([raw]);\n    assert.ok(checked);\n    assert.equal('template' in checked, false);"],
              ]],
              ['.github/workflows/svar-grid.yml', [
                ['bun run test src/components/svar-grid-contract.test.ts', 'bun run test src/components/svar-grid'],
              ]],
            ];
            const tree = [];
            for (const [path, replacements] of edits) {
              const response = await github.rest.repos.getContent({ owner, repo, path, ref: expected });
              let text = Buffer.from(response.data.content, 'base64').toString('utf8');
              for (const [before, after] of replacements) {
                if (text.split(before).length !== 2) throw new Error(`Expected unique replacement in ${path}`);
                text = text.replace(before, after);
              }
              const blob = await github.rest.git.createBlob({ owner, repo, content: text, encoding: 'utf-8' });
              tree.push({ path, mode: '100644', type: 'blob', sha: blob.data.sha });
            }
            tree.push({ path: '.github/workflows/svar-fix-owned-files.yml', mode: '100644', type: 'blob', sha: null });
            const base = await github.rest.git.getCommit({ owner, repo, commit_sha: expected });
            const result = await github.rest.git.createTree({ owner, repo, base_tree: base.data.tree.sha, tree });
            const commit = await github.rest.git.createCommit({ owner, repo, message: 'fix(svar): refine exact types and include all adapter unit tests', tree: result.data.sha, parents: [expected] });
            await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.data.sha, force: false });
            core.info(`Updated owned files at ${commit.data.sha}`);
