name: Archive Stripe review evidence
on:
  push:
    branches: [evidence/stripe-first-6303ac76]
    paths: [.github/workflows/archive-stripe-review.yml]
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', fetch-depth: 1}
      - name: Archive verified screenshots without changing implementation or main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          repo=vibeunion/svadmin
          branch=evidence/stripe-first-6303ac76
          for attempt in $(seq 1 20); do
            status=$(gh api repos/$repo/actions/runs/35456971369 --jq .status)
            test "$status" != completed || break
            sleep 15
          done
          gh api repos/$repo/actions/runs/35456971369 > /tmp/stripe-run.json
          test "$(gh api repos/$repo/actions/runs/35456971369 --jq .conclusion)" = success
          gh run download 35456971369 --repo "$repo" --dir /tmp/stripe-review
          python3 <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          run=json.loads(Path('/tmp/stripe-run.json').read_text())
          assert run['head_sha']=='6303ac76dfe198d7e41692d1ca336b18a233d422'
          reports=list(Path('/tmp/stripe-review').rglob('report.json'))
          assert len(reports)==1
          source=reports[0].parent
          report=json.loads(reports[0].read_text())
          assert len(report['scenes'])==228 and all(x['passed'] for x in report['scenes']) and report['failures']==[]
          assert len(report['interactions'])==6 and all(x['passed'] for x in report['interactions'])
          keyboard=json.loads((source/'keyboard.json').read_text())
          colors=json.loads((source/'status-colors.json').read_text())
          assert len(keyboard)==2 and all(x['passed'] for x in keyboard)
          assert len(colors)==2 and all(x['passed'] for x in colors)
          target=Path('design/stripe-first/evidence/6303ac76'); target.mkdir(parents=True,exist_ok=True)
          names=['resource-list-ready-light-en-1440.png','resource-list-ready-light-en-1920.png','record-detail-ready-light-zh-CN-1440.png','settings-ready-dark-zh-CN-390.png','components-ready-dark-en-1440.png']
          manifest={'head':run['head_sha'],'testedRevision':report['revision'],'run':run['id'],'source':'GitHub Actions artifact; unmodified captures','screenshots':[]}
          scenes={x['screenshot']:x for x in report['scenes']}
          for name in names:
              rel='screenshots/'+name
              data=(source/rel).read_bytes()
              assert hashlib.sha256(data).hexdigest()==scenes[rel]['sha256']
              (target/name).write_bytes(data)
              manifest['screenshots'].append({'file':name,'sha256':hashlib.sha256(data).hexdigest(),'scene':scenes[rel]['id']})
          for name in ['report.json','keyboard.json','status-colors.json']:
              shutil.copyfile(source/name,target/name)
          (target/'provenance.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          git rm .github/workflows/archive-stripe-review.yml
          git add design/stripe-first/evidence/6303ac76
          git diff --cached --check
          git config user.name 'svadmin automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(design): archive Stripe product screenshots and exact-run provenance'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
      - name: Extract bounded previous-CI failure diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/stripe-diagnostics
          gh run view 35455768055 --repo vibeunion/svadmin --job 105930630915 --log > /tmp/stripe-diagnostics/full.log
          python3 <<'PY'
          import re
          from pathlib import Path
          lines=Path('/tmp/stripe-diagnostics/full.log').read_text(errors='replace').splitlines()
          picked=set()
          for i,line in enumerate(lines):
              if re.search(r'(FAIL\s|\(fail\)|AssertionError|Failed Tests|Test Files.*failed)',line):
                  picked.update(range(max(0,i-2),min(len(lines),i+14)))
          out='\n'.join(lines[i] for i in sorted(picked))[-18000:]
          Path('/tmp/stripe-diagnostics/summary.txt').write_text(out+'\n')
          print(out)
          Path('/tmp/stripe-diagnostics/full.log').unlink()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stripe-bounded-ci-diagnostics
          path: /tmp/stripe-diagnostics/summary.txt
          if-no-files-found: warn
          retention-days: 2
