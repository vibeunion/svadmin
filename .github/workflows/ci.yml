name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Immutable commit SHA created by release-please
        required: false
        type: string
        default: ""
      release_manifest:
        description: JSON array of release-please package paths and tags
        required: false
        type: string
        default: "[]"
      e2e_sha:
        description: Optional commit SHA used only for E2E verification of an immutable release
        required: false
        type: string
        default: ""
      publish:
        description: Publish the release-please packages after all gates pass
        required: false
        type: boolean
        default: false
      force_publish:
        description: Force publish a previously-tagged release even when test/e2e gates fail (for back-publishing a version whose tag already exists but whose original CI failed)
        required: false
        type: boolean
        default: false

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code -- bun.lock

      - name: Lint
        run: bun run lint

      - name: Build workspace packages
        run: bun run build:packages

      - name: Verify Lite SSR consumer
        run: bun run check:lite:ssr

      - name: Run tests
        run: bun run test

      - name: Build example application
        run: bun run --cwd example build

      - name: Verify example bundle budgets
        run: bun run bundle:check

      - name: Build documentation site
        run: bun run docs:build

      - name: Type check
        run: bun run typecheck

      - name: Verify npm tarballs and consumer imports
        run: bun run pack:check

      - name: Audit dependencies
        run: bun run audit

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || inputs.publish

    steps:
      - name: Validate E2E recovery SHA
        if: inputs.e2e_sha != ''
        env:
          E2E_SHA: ${{ inputs.e2e_sha }}
        run: |
          if [[ ! "$E2E_SHA" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "::error::Invalid E2E SHA"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.e2e_sha || inputs.release_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code -- bun.lock

      - name: Build workspace packages
        run: bun run build:packages

      - name: Install Playwright browsers
        run: bun run playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run playwright test
        # continue-on-error: true  -- removed: E2E must gate PRs

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.publish && inputs.release_sha != '' && (inputs.force_publish || (needs.test.result == 'success' && needs.e2e.result == 'success'))
    concurrency:
      group: npm-publish-${{ inputs.release_sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Verify release tags
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: bun scripts/verify-release-manifest.ts

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: |
          bun install
          git diff --exit-code -- bun.lock

      - name: Build publishable packages
        run: bun run build:packages

      - name: Verify dependency closure and plan publication
        id: release_plan
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: |
          set -euo pipefail
          {
            echo 'paths<<SVADMIN_RELEASE_PATHS'
            bun scripts/plan-release-publication.ts
            echo 'SVADMIN_RELEASE_PATHS'
          } >> "$GITHUB_OUTPUT"

      - name: Prepare publish manifests
        run: |
          set -e
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const pkgs = fs.readdirSync('packages').filter(p => fs.statSync(path.join('packages', p)).isDirectory());
          const versions = {};
          for (const p of pkgs) {
            const pjson = path.join('packages', p, 'package.json');
            if (fs.existsSync(pjson)) {
              const data = JSON.parse(fs.readFileSync(pjson, 'utf8'));
              versions[data.name] = data.version;
            }
          }
          for (const p of pkgs) {
            const pjson = path.join('packages', p, 'package.json');
            if (!fs.existsSync(pjson)) continue;
            const raw = fs.readFileSync(pjson, 'utf8');
            const pkg = JSON.parse(raw);
            let changed = false;
            for (const t of ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies']) {
              if (pkg[t]) {
                for (const k in pkg[t]) {
                  if (pkg[t][k] === 'workspace:*' && versions[k]) {
                    pkg[t][k] = '^' + versions[k];
                    changed = true;
                  }
                }
              }
            }
            if (changed) {
              fs.writeFileSync(pjson, JSON.stringify(pkg, null, 2) + '\n');
              console.log('  Rewrote workspace:* in ' + pjson);
            }
          }
          NODE

      - name: Verify publish tarballs and consumer imports
        run: bun run pack:check

      - name: Publish released packages
        env:
          RELEASE_DIRS: ${{ steps.release_plan.outputs.paths }}
        run: |
          set -u
          if [ -z "$RELEASE_DIRS" ]; then
            echo "::error::Release publication plan is empty"
            exit 1
          fi

          failed=0
          while IFS= read -r pkg_dir; do
            PKG_JSON="$pkg_dir/package.json"
            if [ -f "$PKG_JSON" ]; then
              NAME=$(node -p "require(process.argv[1]).name" "./$PKG_JSON")
              LOCAL_VER=$(node -p "require(process.argv[1]).version" "./$PKG_JSON")

              if ! NPM_STATUS=$(bun scripts/npm-package-version.ts "$NAME" "$LOCAL_VER"); then
                echo "::error::npm registry lookup failed for $NAME@$LOCAL_VER"
                failed=1
                continue
              fi

              if [ "$NPM_STATUS" = "missing" ]; then
                echo "🚀 Publishing $NAME@$LOCAL_VER..."
                if ! (cd "$pkg_dir" && npm publish --provenance --access public); then
                  echo "❌ Publish FAILED for $NAME"
                  failed=1
                  continue
                fi
              elif [ "$NPM_STATUS" = "published" ]; then
                echo "⏭️ $NAME@$LOCAL_VER already on npm, skipping"
              else
                echo "::error::Invalid npm registry status for $NAME@$LOCAL_VER: $NPM_STATUS"
                failed=1
                continue
              fi
            else
              echo "::error::Release package manifest not found: $PKG_JSON"
              failed=1
            fi
          done <<< "$RELEASE_DIRS"

          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more release packages failed to publish; see the complete package list above"
            exit 1
          fi
