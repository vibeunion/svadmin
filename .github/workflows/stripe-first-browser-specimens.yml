name: Stripe-first browser specimens
on:
  push:
    branches: [main, feat/stripe-first-design-kit-20260919]
    paths: ['design/stripe-first/**', 'packages/ui/**', 'packages/core/**', 'bun.lock', '.github/workflows/stripe-first-browser-specimens.yml']
  pull_request:
    branches: [main]
    paths: ['design/stripe-first/**', 'packages/ui/**', 'packages/core/**', 'bun.lock', '.github/workflows/stripe-first-browser-specimens.yml']
permissions:
  contents: read
concurrency:
  group: stripe-first-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  specimens:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '26', package-manager-cache: false}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: {bun-version: '1.4.2'}
      - name: Unit contracts before installation
        run: node --test design/stripe-first/build.test.mjs design/stripe-first/preview/model.test.mjs
      - name: Install frozen dependencies and build actual packages
        env: {HUSKY: '0'}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run --cwd packages/ai-elements build
          bun run --cwd packages/ui build
          git diff --exit-code -- bun.lock
      - name: Type-check the actual specimen
        run: node node_modules/svelte-check/bin/svelte-check --tsconfig design/stripe-first/preview/tsconfig.json --fail-on-warnings
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Verify complete state matrix and interactions
        run: node design/stripe-first/preview/verify.mjs
      - name: Verify keyboard-only table scrolling
        run: node design/stripe-first/preview/keyboard.mjs
      - name: Verify no source or dependency mutations
        run: |
          git diff --exit-code -- packages bun.lock
          git diff --check HEAD^ HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stripe-first-browser-specimens-${{ github.sha }}
          path: test-results/stripe-first-browser/
          if-no-files-found: warn
          retention-days: 14
