name: Native primitive migration

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/ui/**'
      - 'packages/ai-elements/**'
      - 'packages/surface/**'
      - 'scripts/*tailwind*'
      - 'scripts/check-package-packs.ts'
      - 'scripts/check-conditional-styles.mjs'
      - 'bun.lock'
      - '.github/workflows/native-primitives.yml'

permissions:
  contents: read

concurrency:
  group: native-primitives-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: node --test scripts/no-tailwind-contract.test.mjs
      - run: node scripts/check-no-tailwind.mjs
  styles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: mkdir -p "$RUNNER_TEMP/native-primitives/logs"
      - run: bun install --frozen-lockfile
      - name: Build native component packages
        id: build
        continue-on-error: true
        run: |
          bun run --cwd packages/ai-elements build 2>&1 | tee "$RUNNER_TEMP/native-primitives/logs/ai-build.log"
          bun run --cwd packages/ui build 2>&1 | tee "$RUNNER_TEMP/native-primitives/logs/ui-build.log"
          bun run --cwd packages/surface build 2>&1 | tee "$RUNNER_TEMP/native-primitives/logs/surface-build.log"
      - name: CSS declarations and native packaging
        id: css
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: bun run --cwd packages/ui test:css 2>&1 | tee "$RUNNER_TEMP/native-primitives/logs/css.log"
      - name: Preserve primitive behavior
        id: behavior
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: packages/ui
        run: bunx --no-install vitest run --config vitest.config.ts src/components/ui/button/button.test.ts src/components/ui/input/input.test.svelte.ts 2>&1 | tee "$RUNNER_TEMP/native-primitives/logs/behavior.log"
      - name: Compiler-free published CSS boundary
        id: runtime
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: node scripts/check-style-boundary.mjs --packages=ui,ai-elements,surface 2>&1 | tee "$RUNNER_TEMP/native-primitives/logs/runtime.log"
      - name: Surface type checks
        id: types
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: bun run --cwd packages/surface check 2>&1 | tee "$RUNNER_TEMP/native-primitives/logs/types.log"
      - name: Chromium compatibility and conditional styles
        id: browser
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          bunx --no-install playwright install --with-deps chromium
          node scripts/check-conditional-styles.mjs 2>&1 | tee "$RUNNER_TEMP/native-primitives/logs/conditional-styles.log"
      - name: Preserve exact source and diagnostics
        if: always()
        env:
          RESULTS: ${{ toJSON(steps) }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-primitives"
          git rev-parse HEAD > "$RUNNER_TEMP/native-primitives/commit.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/native-primitives/source.tar.gz" HEAD
          printf '%s\n' "$RESULTS" > "$RUNNER_TEMP/native-primitives/results.json"
          if test -d packages/ui/dist; then tar -czf "$RUNNER_TEMP/native-primitives/ui-dist.tar.gz" -C packages/ui dist; fi
          if test -d packages/surface/dist; then tar -czf "$RUNNER_TEMP/native-primitives/surface-dist.tar.gz" -C packages/surface dist; fi
          if test -d test-results/ui-styles; then cp -R test-results/ui-styles "$RUNNER_TEMP/native-primitives/"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-primitives-evidence
          path: ${{ runner.temp }}/native-primitives/
          retention-days: 14
      - name: Require every style verification to pass
        if: always() && (steps.build.outcome != 'success' || steps.css.outcome != 'success' || steps.behavior.outcome != 'success' || steps.runtime.outcome != 'success' || steps.types.outcome != 'success' || steps.browser.outcome != 'success')
        run: exit 1
