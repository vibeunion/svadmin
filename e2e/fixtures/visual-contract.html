<!doctype html>
<html lang="zh-CN" class="layout-clean-flat" data-theme="default">
  <head>
    <meta charset="utf-8" />
    <title>SVAdmin visual contract</title>
    <link rel="stylesheet" href="/packages/ui/src/app.css" />
    <style>
      body { margin: 0; }
      .shell {
        display: grid;
        grid-template-columns: var(--svadmin-shell-sidebar-w) minmax(0, 1fr);
        min-height: 100vh;
      }
      .rail, .top {
        background: var(--sidebar);
        color: var(--sidebar-foreground);
      }
      .rail { padding: 16px; }
      .top { height: var(--svadmin-shell-topbar-h); display: flex; align-items: center; padding-inline: var(--svadmin-shell-gutter); background: var(--card); border-bottom: 1px solid var(--border); }
      main { background: var(--background); padding: var(--svadmin-shell-gutter); display: grid; gap: 16px; align-content: start; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    </style>
  </head>
  <body>
    <div class="shell" data-svadmin-shell>
      <aside class="rail" data-svadmin-sidebar>导航</aside>
      <div>
        <header class="top" data-svadmin-topbar>SVAdmin</header>
        <main>
          <p class="svadmin-text" id="body-copy">正文 14 / 1.4。Body copy stays on the token.</p>
          <div class="svadmin-copy copy">
            <p>第一段说明。</p>
            <p id="second-paragraph">第二段与上一段之间使用段落间距。</p>
          </div>
          <div class="row" id="buttons">
            <button class="svadmin-button svadmin-button--default" id="primary">主要</button>
            <button class="svadmin-button svadmin-button--default" id="primary-disabled" disabled>主要禁用</button>
            <button class="svadmin-button" data-status="danger" id="danger">危险</button>
            <button class="svadmin-button" data-status="danger" id="danger-disabled" disabled>危险禁用</button>
            <button class="svadmin-button" data-status="warning" id="warning">警告</button>
            <button class="svadmin-button" data-status="warning" id="warning-disabled" disabled>警告禁用</button>
          </div>
          <a class="svadmin-link" id="link" href="#link">链接</a>
          <div class="svadmin-dialog-overlay" id="mask" style="position:relative;inset:auto;height:72px"></div>
        </main>
      </div>
    </div>
  </body>
</html>
